     离线算一遍反而简单：一个音不到十万次加法，缓存下来只算一次。 */
  var KS_SECONDS = 3.4;                                 // 环缓冲的长度
  var ksCache = Object.create(null);

  function ksBuffer(freq) {
    var sr = ctx.sampleRate;
    var N = Math.max(2, Math.round(sr / freq));
    var total = Math.ceil(sr * KS_SECONDS);
    var buf = ctx.createBuffer(1, total, sr);
    var d = buf.getChannelData(0);
    var ring = new Float32Array(N);
    // 激励：噪声。理想是"拨片位置"的梳状滤波激励，但噪声打底已经足够像弦，
    // 加梳状反而容易在某个音上出现金属声。
    for (var i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;

    // 阻尼：每个采样乘一次，所以衰减时间由它定，与音高无关 ——
    // 高音弦"余韵短"是另一回事，由下面那个平均滤波（每圈削掉一点高频）自然给出。
    // 目标是 KS_SECONDS 秒后剩千分之一点五。采样率在这里才拿得到，所以不能提到外面算。
    var damp = Math.pow(0.0015, 1 / (sr * KS_SECONDS));
    var idx = 0;
    for (var n = 0; n < total; n++) {
      var cur = 0.5 * (ring[idx] + ring[(idx + 1) % N]) * damp;
      ring[idx] = cur;
      d[n] = cur;
      idx = (idx + 1) % N;
    }
    // 头几个采样是纯噪声激励，起点不为零，直接播会"啪"一下。
    // 只淡 3ms：拨弦的起音本来就该是硬的，淡久了就不是拨弦了。
    var fade = Math.min(total, Math.round(sr * 0.003));
    for (var k = 0; k < fade; k++) d[k] *= k / fade;
    return buf;
  }

  function pluck(freq, dur, when, gain) {
    if (!ctx) return;
    var t = when == null ? ctx.currentTime : when;
    var amp = gain == null ? 1 : gain;
    var d = dur == null ? 2.6 : dur;

    // 缓存键取到 0.5Hz：足够分辨五声音阶的每一级，又不至于每个音都重算
    var key = Math.round(freq * 2);
    var buf = ksCache[key];
    if (!buf) {
      buf = ksCache[key] = ksBuffer(freq);
    }

    var out = ctx.createGain();
    out.gain.value = 0.30 * amp;
    route(out);

    var src = ctx.createBufferSource();
    src.buffer = buf;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(1, t + 0.004);            // 拨弦起音就是 4ms
    g.gain.setTargetAtTime(0.0001, t + d, 0.22);             // 手按住弦，收尾
    src.connect(g); g.connect(out);
    src.start(t); src.stop(t + Math.min(d + 1.2, 3.4));
  }

  /* ---------- 弓弦（坠胡 / 二胡） ---------- */
  /* 两把略微失谐的锯齿波过一带共振的低通：失谐产生"弦的群感"，
     低通给琴筒的共鸣，起音慢（弓是压上去的，不是敲上去的）。 */
  function bow(freq, dur, when, gain) {
    if (!ctx) return;
    var t = when == null ? ctx.currentTime : when;
    var amp = gain == null ? 1 : gain;
    var d = dur == null ? 1.5 : dur;

    var out = ctx.createGain();
    out.gain.value = 0.16 * amp;
    route(out);

    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(Math.min(freq * 7, 3200), t);
    lp.Q.value = 2.4;                                        // 琴筒的共振峰
    lp.connect(out);

    var main = ctx.createOscillator();
    main.type = 'sawtooth';
    main.frequency.setValueAtTime(freq, t);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.85, t + 0.11);          // 弓的慢起音
    g.gain.setTargetAtTime(0.6, t + 0.2, 0.3);
    g.gain.setTargetAtTime(0.0001, t + d, 0.14);
    main.connect(g); g.connect(lp);
    main.start(t); main.stop(t + d + 0.5);

    var sub = ctx.createOscillator();
    sub.type = 'sawtooth';
    sub.detune.value = 7;                                    // ±7 音分：两把弦的群感
    sub.frequency.setValueAtTime(freq, t);
    var sg = ctx.createGain();
    sg.gain.value = 0.6;
    sub.connect(sg); sg.connect(g);
    sub.start(t); sub.stop(t + d + 0.5);

    vibrato(main, t, d, 5.6, 16);                            // 拉弦的颤音比吹管深
    vibrato(sub, t, d, 5.6, 16);
  }

  /* ---------- 唢呐 ---------- */
  /* 双簧管类：谐波极丰富（几乎是全谐波），所以"亮"且"糙"。
     关键是那个 1.6kHz 附近的共振峰 —— 没有它，全谐波只会听起来像锯齿波。 */
  var reedWave = null;
  function getReedWave() {
    if (reedWave) return reedWave;
    var N = 40, real = new Float32Array(N), imag = new Float32Array(N);
    for (var i = 1; i < N; i++) imag[i] = 1 / Math.pow(i, 0.82);   // 滚降很浅：又亮又糙
    reedWave = ctx.createPeriodicWave(real, imag);
    return reedWave;
  }

  function reed(freq, dur, when, gain) {
    if (!ctx) return;
    var t = when == null ? ctx.currentTime : when;
    var amp = gain == null ? 1 : gain;
    var d = dur == null ? 0.9 : dur;

    var out = ctx.createGain();
    out.gain.value = 0.14 * amp;                             // 唢呐最响，这里压得最狠
    route(out);

    var formant = ctx.createBiquadFilter();
    formant.type = 'peaking';
    formant.frequency.value = 1600; formant.Q.value = 1.2; formant.gain.value = 9;
    formant.connect(out);

    var osc = ctx.createOscillator();
    osc.setPeriodicWave(getReedWave());
    // 起音先"吹低了再顶上去"：唢呐的哨片一上来总是偏低一点，
    // 这个上滑是它听起来像唢呐而不是像合成器的地方。
    osc.frequency.setValueAtTime(freq * 0.955, t);
    osc.frequency.exponentialRampToValueAtTime(freq, t + 0.075);

    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.9, t + 0.022);          // 哨片起音极快
    g.gain.setTargetAtTime(0.62, t + 0.05, 0.25);
    g.gain.setTargetAtTime(0.0001, t + d, 0.1);
    osc.connect(g); g.connect(formant);
    osc.start(t); osc.stop(t + d + 0.4);

    vibrato(osc, t, d, 6.2, 14);
    chiff(t, amp * 0.5, 3600);                               // 哨片的一点气声，比笛子细
  }

  /* 骨笛滑音：用 setTargetAtTime 做手指渐开孔的滑音 */
  function fluteSlide(steps, root, when, stepDur, gain) {
    if (!ctx) return;
    var t0 = when == null ? ctx.currentTime : when;
    var sd = stepDur == null ? 0.42 : stepDur;
    for (var i = 0; i < steps.length; i++) {
      flute(noteOf(root || 587.33, steps[i]), sd * 0.94, t0 + i * sd, gain);
    }
  }

  /* ---------- 木门吱呀 ---------- */
  /* 白噪过带通，中心频率从 900Hz 滑到 380Hz。
     真实的门轴是"粘滑"振动，所以叠两层不同中心频率的带通 + 轻微幅度起伏，
     单层带通听起来像风声而不是门。
     这同时是第一个用户手势，顺手把 AudioContext 唤醒。 */
  function creak() {
    unlock();
    if (!ctx) return;
    var t = ctx.currentTime;
    var dur = 1.55;

    /* ⚠️ 这个 6.5 不是"把音量拧大一点"，是补带通滤波吃掉的电平。
       下面两条带通的 Q 分别 9 与 6.5，中心 900/1480Hz：
       白噪过 Q=9 的带通，只留下约 f0/Q×π/2 ≈ 160Hz 的带宽，
       相对 22050Hz 的奈奎斯特带，幅度先被砍到 1/12 左右。
       原先这里写的是 0.5，等于把"带通后的噪声"当成了"接近满幅的信号"，
       于是整段吱呀声经过 out(0.5) → dry(0.78) → master(0.3) 之后
       只剩 RMS 0.0009 —— 比其余音色低 25dB，实测等于没有。
       这可是推门那一下，全片第一个声音，哑了整段开场就空掉。

       tools/audio-check.html 量的就是它：改前 creak·吱呀 -24.9dB（判"几乎无声"），
       改后与其余音色齐平、且仍略低于末尾的落定闷响（那记是不经 out 的，
       峰值约 0.098）—— 摩擦垫在下面、闷响落在上面，主次才对。 */
    var out = ctx.createGain();
    out.gain.value = 6.5;
    route(out);

    [[900, 300], [1480, 620]].forEach(function (pair, idx) {
      var n = noiseSource();
      var bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.Q.value = idx ? 6.5 : 9;
      bp.frequency.setValueAtTime(pair[0], t);
      bp.frequency.exponentialRampToValueAtTime(pair[1], t + dur);

      var g = ctx.createGain();
      var peak = idx ? 0.10 : 0.17;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak * 0.6, t + 0.14);
      g.gain.linearRampToValueAtTime(peak, t + 0.5);
      g.gain.linearRampToValueAtTime(peak * 0.45, t + 0.95);
      g.gain.linearRampToValueAtTime(peak * 0.8, t + 1.24);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

      // 幅度抖动：粘滑振动的粗糙感
      var wob = ctx.createOscillator();
      wob.type = 'sine';
      wob.frequency.value = idx ? 17 : 11.5;
      var wobG = ctx.createGain();
      wobG.gain.value = peak * 0.22;
      wob.connect(wobG); wobG.connect(g.gain);

      n.connect(bp); bp.connect(g); g.connect(out);
      n.start(t); n.stop(t + dur + 0.05);
      wob.start(t); wob.stop(t + dur + 0.05);
    });

    // 门到位的闷响：低频正弦 + 噪声，短促
    var thud = ctx.createOscillator();
    thud.type = 'sine';
    thud.frequency.setValueAtTime(96, t + dur);
    thud.frequency.exponentialRampToValueAtTime(52, t + dur + 0.22);
    var tg = ctx.createGain();
    tg.gain.setValueAtTime(0.0001, t + dur);
    tg.gain.linearRampToValueAtTime(0.42, t + dur + 0.012);
    tg.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.34);
    thud.connect(tg); route(tg);
    thud.start(t + dur); thud.stop(t + dur + 0.4);
  }

  /* ---------- 泛用音效 ---------- */
  /* UI 反馈：极短的一声，像指尖点了一下木鱼边 */
  function blip(pitch, gain) {
    if (!ctx) return;
    var t = ctx.currentTime;
    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = pitch || 1180;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.07 * (gain == null ? 1 : gain), t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    osc.connect(g); g.connect(dry); g.connect(conv);
    osc.start(t); osc.stop(t + 0.15);
  }

  /* 形章点开一座城：**"木子落枰"的一声**。
     从前这里借的是泛用 blip(1046, .4) —— 峰值 0.07×0.4 = 0.028，
     再过一道 master(0.3)，出来不到 0.01。翻章那一下都有 0.056，
     也就是说形章唯一的一个动作反馈，是**全站最轻的一处**。
     听不见不是没响，是本来就没给够分量，所以这里不是调参数，是重做一声。

     音高仍取 1046Hz —— 与原来那一枚同一个音，观众认得出"还是这一下"，
     变的只是质地与分量。质地做成木头的，两层：
       ① 12ms 的带通噪声当敲击。中心取 2.4k：再高就成了敲瓷碗，
          再低就只剩一个闷包，丢掉"点到了"的那一点锋利。
       ② 三角波从 1046 滑到 700，40ms 内落定。**下滑是"木"与"铃"的分界** ——
          铃是平着响的，木头一敲音就往下走。

     增益是量出来的，不是估的（tools/audio-check.html 有常驻一格）：
     先给 0.16/0.20 时，离线渲染出来峰值 0.049，还是压在中位之下 10dB，
     跟泛用 blip 几乎打平 —— 分量仍然不够。现在 0.22/0.30，
     峰值走到约 0.075，是旧那一声（0.007）的十倍出头，
     也明显高于泛用 blip（0.021），层级是「点城 > 点卡片 > 翻章」。
     ⚠️ 这是**输出端**的数（过了 master 0.3 与 dry/wet）；
     文件里其他音色注释写的是节点增益，两者差约 4 倍，别混着比。 */
  function mapPick(gain) {
    if (!ctx) return;
    var t = ctx.currentTime;
    var amp = (gain == null ? 1 : gain);

    var n = noiseSource();
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 1.2;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.linearRampToValueAtTime(0.22 * amp, t + 0.002);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
    n.connect(bp); bp.connect(ng); route(ng);
    n.start(t); n.stop(t + 0.06);

    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1046, t);
    osc.frequency.exponentialRampToValueAtTime(700, t + 0.04);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.30 * amp, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    osc.connect(g); route(g);
    osc.start(t); osc.stop(t + 0.28);
  }

  /* 一声低沉的"开启"音：用于章节转场 */
  function gong(root, gain) {
    if (!ctx) return;
    bell(noteOf(root || 98, 0), ctx.currentTime, (gain == null ? 1 : gain) * 1.15);
  }

  /* ---------- 导出 ---------- */
  H.audio = {
    supported: true,
    unlock: unlock,
    get ctx() { return ctx; },
    get now() { return ctx ? ctx.currentTime : 0; },
    /* 音画联动的取声口。analyser 直接暴露是为了将来可能要看频域；
       日常只需要 wave()（波形）与 level()（响度）。 */
    get analyser() { return analyser; },
    wave: wave,
    level: level,
    noteOf: noteOf,
    bell: bell,
    bellSeq: bellSeq,
    flute: flute,
    fluteSlide: fluteSlide,
    /* 声章新增的四个音色：埙 / 拨弦 / 弓弦 / 唢呐。
       每件乐器一个音色 —— 光换图不换声，"陈列"就只是个图标列表。 */
    xun: xun,
    pluck: pluck,
    bow: bow,
    reed: reed,
    creak: creak,
    blip: blip,
    mapPick: mapPick,
    gong: gong,
    /* 给外部（如可敲编钟）用的音阶根音 */
    ROOT_BELL: 130.81,    // C3
    ROOT_FLUTE: 587.33,   // D5
    ROOT_XUN: 440,        // A4：埙是低音乐器，比笛子低一截
    ROOT_SE: 196,         // G3：瑟的弦长、音低
    ROOT_BOW: 293.66,     // D4：坠胡
    ROOT_REED: 523.25     // C5：唢呐的筒音，实际常吹得更高
  };

})();

</script>
<!-- 水墨粒子层。插在 10 与 20 之间只为编号顺位，它只依赖 00-core.js -->
<script data-from="assets/js/15-ink.js">
/* ============================================================================
 *  15-ink.js —— 水墨粒子层
 *
 *  一层全屏 canvas，画两件事：
 *    · ambient 极缓慢的墨雾自己漂 —— 用在序章与非遗卷，呼应粉墙上的墨云
 *    · trail   指尖或鼠标划过，拖出一道洇开的墨 —— **当前没有任何一章在用**
 *
 *  trail 为什么收起：它在形章上是一道跟着指针走的墨线，用户看过之后要求取消这个
 *  「墨线效果」（题名卷那处同理一并关掉）。代码原样留着，没有删 ——
 *  它是 MODE 里改一个词就能请回来的东西，而删掉之后想凭记忆把这段拖尾的
 *  衰减与扩散再写一遍，代价远大于留着的这点体积。
 *
 *  这一层为什么要放在**颗粒层之下**：
 *    全站有四个固定的质感层（mottle 87 / fiber 88 / vignette 89 / grain 90），
 *    其中 grain 是高频噪点、压在最上面。把墨迹放到 grain 之上（z 91），
 *    它会显得像贴在玻璃上；放到 grain 之下（z 89），那层噪点就盖在墨上 ——
 *    墨于是像"印进纸里"，而不是"浮在屏幕上"。这是全站一以贯之的那件事，
 *    多花一层也不该破。代价是墨迹会比放在顶层柔一点，这个代价付得值。
 *
 *  ⚠️ 性能是这一层唯一的风险，全部代价都花在下面这几处：
 *     · 柔和的径向 sprite **预渲染一次**到离屏 canvas，之后只 drawImage 贴。
 *       每帧现画 createRadialGradient 是这类效果最常见的掉帧原因。
 *     · 存活粒子上限按设备降级（粗指针 / 核心数少 → 上限减半）
 *     · 每帧用低透明度 destination-out 铺一层做淡出，不用 clearRect
 *       （clearRect 会把墨迹一刀切没，那是"擦掉"不是"洇开"）
 *     · 页面不可见时停 rAF
 *     · prefers-reduced-motion 时**整层不建**
 * ========================================================================== */
(function () {
  'use strict';
  var H = window.HENAN;
  if (!H) return;

  /* 每一章挂哪种模式。没有条目的章节就是不画。
     味卷与声卷**特意不开**：味卷整章都在横向拖拽，再叠一层跟手的墨会打架；
     声卷已经有音画联动的环形水纹，两层动态叠在一起只会互相削弱。

     形卷与题名卷原为 'trail'，现改为 'off'（理由见文件头）。
     注意 'off' 是**整章不画**，不是换成 ambient —— 用户要的是"取消"，
     不是我替他挑一种替代的墨；想改成墨雾，把这里的 'off' 写成 'ambient' 即可。 */
  var MODE = {
    gate:    'ambient',
    map:     'off',
    scroll:  'off',
    sound:   'off',
    crafts:  'ambient',
    name:    'off'
  };

  /* 墨分三色，随机取 —— 单一色值的墨迹看着像一串同样的圆点，没有深浅 */
  var INKS = ['28,26,23', '56,49,42', '103,91,74'];

  var cv, ctx, sprite = null;
  var parts = [];
  var mode = 'off';
  var raf = 0, running = false;
  var dpr = 1, W = 0, Hh = 0;
  var ambientAcc = 0;

  /* 存活粒子上限。--hud 那类"粗指针设备性能更好"的假设不成立：
     手指操作的多半是手机，反而更弱。所以按最保守的那一项降级。 */
  var MAX = (function () {
    var weak = false;
    try {
      weak = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
             (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
    } catch (e) { /* 探测失败就当强设备，但上限本来也不高 */ }
    return weak ? 70 : 170;
  })();

  /* ---------- sprite：柔和墨点，只画一次 ---------- */
  /* 用一个 64×64 的离屏画布：中心浓、向外渐淡到全透明。
     贴的时候按粒子半径缩放 drawImage，比每帧画渐变快一到两个数量级。 */
  function makeSprite() {
    var s = document.createElement('canvas');
    s.width = s.height = 64;
    var c = s.getContext('2d');
    var g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    /* ⚠️ 中心不能太实。
       第一版给的是 0.85，配上 multiply 与 0.3~0.55 的 alpha，
       拍出来是一屏**脏点子** —— 每个粒子都是一枚边界清楚的深色圆盘，
       既不像墨、也不像水，只像屏幕上落了灰。
       水墨的要点是"没有边界"：中心只要六成、且一路缓降到零，
       叠出来的才是一片有浓淡的渍，而不是一堆圆。 */
    g.addColorStop(0,    'rgba(255,255,255,0.5)');
    g.addColorStop(0.3,  'rgba(255,255,255,0.26)');
    g.addColorStop(0.62, 'rgba(255,255,255,0.09)');
    g.addColorStop(1,    'rgba(255,255,255,0)');
    c.fillStyle = g;
    c.fillRect(0, 0, 64, 64);
    return s;
  }

  /* ---------- 尺寸 ---------- */
  function resize() {
    if (!cv) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);   // 上限压到 2：3x 屏上像素量翻两倍多，肉眼换不来
    W = window.innerWidth;
    Hh = window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(Hh * dpr);
    cv.style.width = W + 'px';
    cv.style.height = Hh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, Hh);
  }

  /* ---------- 粒子 ---------- */
  function push(x, y, opt) {
    if (parts.length >= MAX) return;
    opt = opt || {};
    var a = opt.ambient;
    parts.push({
      x: x, y: y,
      // 环境雾几乎不动；指尖墨沿运动方向甩开一点
      vx: a ? (Math.random() - 0.5) * 0.12 : (Math.random() - 0.5) * 0.9,
      vy: a ? -0.05 - Math.random() * 0.1   : (Math.random() - 0.5) * 0.9 - 0.15,
      r: a ? 26 + Math.random() * 34 : 8 + Math.random() * 15,
      // 环境雾的半径会缓慢胀开，指尖墨基本不变
      grow: a ? 0.06 + Math.random() * 0.08 : 0,
      life: 1,
      // 环境雾淡得极慢（要"雾"，不是"烟"）
      decay: a ? 0.0016 + Math.random() * 0.0014 : 0.022 + Math.random() * 0.02,
      ink: INKS[(Math.random() * INKS.length) | 0],
      /* 透明度压得很低。乘上 sprite 中心那 0.5，单粒的实际最深也就一成上下 ——
         墨是**一层层积**出来的，不是一笔画上去的。
         第一版给到 0.55，等于每一粒都当主角，整屏立刻脏掉。 */
      alpha: a ? 0.07 + Math.random() * 0.07 : 0.11 + Math.random() * 0.13,
      /* 每粒再叠一个错位的小墨点。
         单靠一个径向渐变，粒子永远是个正圆；两个错位的叠起来，
         边界就散开了，看着像一团洇开的渍。
         比 save/rotate/scale 一个椭圆便宜，效果也更好。 */
      ox: (Math.random() - 0.5) * 1.5,
      oy: (Math.random() - 0.5) * 1.5,
      os: 0.42 + Math.random() * 0.3
    });
  }

  /* ---------- 每帧 ---------- */
  function frame() {
    raf = 0;
    if (!running || !ctx) return;

    /* 淡出。用 destination-out 铺一层极低透明度的黑 ——
       它按"擦除"的方式作用在已有像素上，于是墨迹是**渐渐洇淡**的。
       用 clearRect 会一刀切没，那是"擦掉"不是"洇开"，手感完全不同。 */
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.052)';
    ctx.fillRect(0, 0, W, Hh);

    ctx.globalCompositeOperation = 'source-over';

    var i, p;
    for (i = parts.length - 1; i >= 0; i--) {
      p = parts[i];
      p.x += p.vx;
      p.y += p.vy;
      p.r += p.grow;
      p.life -= p.decay;
      if (p.life <= 0) { parts.splice(i, 1); continue; }

      // 出场淡入、退场淡出，两头都收住，免得墨点"啪"地出现又"啪"地消失
      var a = p.alpha * p.life * Math.min(1, (1 - p.life) * 7);
      if (a <= 0.004) continue;

      /* sprite 本身是白色的蒙版，颜色靠一张染过色的副本带进来（见 tinted）。
         每个粒子贴两下：一大一小、错开一点，边界就不成圆了。 */
      ctx.globalAlpha = a;
      var spr = tinted(p.ink);
      ctx.drawImage(spr, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      var r2 = p.r * p.os;
      ctx.drawImage(spr, p.x + p.ox * p.r - r2, p.y + p.oy * p.r - r2, r2 * 2, r2 * 2);

    ctx.globalAlpha = 1;

    if (mode === 'ambient') {
      ambientAcc += 1;
      // 每 ~22 帧吐一颗。环境雾靠"少而慢"成立，密了就成烟幕
      if (ambientAcc >= 22) {
        ambientAcc = 0;
        push(Math.random() * W, Hh * (0.3 + Math.random() * 0.7), { ambient: true });

  function tinted(rgb) {
    if (tintCache[rgb]) return tintCache[rgb];
    var s = document.createElement('canvas');
    s.width = s.height = 64;
    var c = s.getContext('2d');

  /* 进入一章时先撒一把，让墨雾**当场就在那儿**。
     不这么做的话，进门头二十来秒画面是空的，雾要慢慢攒出来 ——
     而观众对"这一章有没有墨"的判断，在头两秒就做完了。
     用种子随机（不是 Math.random）：同一个视口尺寸下每次打开都一样，
     否则每次截图都不同，就没法靠截图判断改动是好是坏。
     （同 30-gate.js 的 mulberry，那条教训是那边先记下的。） */

    var seed = 20260926;
    function rnd() {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);

      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

    for (var i = 0; i < 9; i++) {
      push(rnd() * W, Hh * (0.22 + rnd() * 0.72), { ambient: true });

      parts[parts.length - 1].life = 0.35 + rnd() * 0.6;

  function setMode(next) {
    if (next === mode) return;
    mode = next || 'off';
    if (mode === 'off') {
      // 换到不画墨的章节：让已有的墨自己淡完，不硬清（硬清会在转场中途"啪"地消失）
      parts.length = 0;
      if (ctx) ctx.clearRect(0, 0, W, Hh);
    } else {
      if (mode === 'ambient') seedAmbient();
      wake();
    }

    if (cv) return;
    if (H.reduceMotion) return;         // 减动效：整层不建，连 canvas 都不进 DOM 开销

    cv = document.createElement('canvas');
    cv.className = 'ink';
    cv.id = 'inkLayer';
    cv.setAttribute('aria-hidden', 'true');

    window.addEventListener('resize', H.rafThrottle(resize));
    window.addEventListener('pointermove', onMove, { passive: true });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
        running = false;
      } else {

      }
    });

    H.on('chapter:enter', function (e) { if (e && e.id) setMode(MODE[e.id]); });
    setMode(MODE[H.current()] || 'off');

    /* #ink=1 —— 立刻撒一把墨 + 画一帧，把这个层拍下来核对。
       为什么需要它：无头截图的 --virtual-time-budget 快进的是 setTimeout，
       **推不动 rAF**（帧由合成器产出，虚拟时钟不驱动它）——
       与 base.css 里那条"虚拟时钟推不动 CSS 过渡"是同一个成因。
       所以正常路径在无头下拍出来永远是一张没有墨的图，
       加了 diag 也只看得到"层建了、没报错"，看不出画得对不对。
       这个钩子的唯一用途，就是把"看不见的"变成"拍得到的"。 */

      var s2 = 7777;
      function r2() { s2 = (s2 * 1103515245 + 12345) & 0x7fffffff; return s2 / 0x7fffffff; }
      for (var k = 0; k < n; k++) {
        push(r2() * W, Hh * (0.12 + r2() * 0.8), { ambient: mode !== 'trail' });
        parts[parts.length - 1].life = 0.45 + r2() * 0.5;
      }

      running = true;
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      frame();
      running = false;
      if (raf) { cancelAnimationFrame(raf); raf = 0; }

     这时要把已经建好的层收掉，而不是留着它继续动。 */
  H.on('chapter:enter', function () {
    if (H.reduceMotion && cv) {
      cv.remove();
      cv = null; ctx = null;
      parts.length = 0;
      mode = 'off';
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      running = false;
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

})();

</script>

<script data-from="assets/js/18-tilt.js">
/* ============================================================================
 *  18-tilt.js —— 手机倾斜（陀螺仪）
 *
 *  这是全站唯一一件**只有手机能做**的事，也是"移动端版"最好的存在理由：
 *  桌面端无论怎么做都做不出"机身一动，画面跟着动"。
 *
 *  做得很克制，只有两处，都是几像素到一两度的量级：
 *    · 序章：门后院子与天光随倾斜平移几个像素（视差）—— 站在门外探头往里看
 *    · 形章：地图纸面微倾 ≤1.2° —— 让它像一张摊在桌上的纸
 *  味章、声章**不做**：前者整章占着横向拖拽手势，后者已经有音画联动，
 *  再加一层动态只会互相削弱。
 *
 *  ---------- 两个必须处理的坑 ----------
 *
 *  1. **iOS 13+ 要用户手势里申请权限**，安卓不需要。
 *     申请时机挂在推门那一下（30-gate.js）—— 那里已经是全站指定的第一个用户手势
 *     （已经在调 H.audio.creak() → unlock()，浏览器对音频的自动播放策略也在那儿解）。
 *     到这一步观众已经决定要看下去了，是提出请求最合理的时机，
 *     而不是一进门就拿一个权限弹窗拦在门前。
 *
 *  2. **用户拒绝或设备不支持时，必须静默什么都不做**。
 *     不提示、不阻断、不二次询问 —— 它只是锦上添花，
 *     绝不能让"没给权限"变成"这个页面有问题"。
 *
 *  ---------- 性能 ----------
 *  deviceorientation 大约 60Hz 触发。直接写 CSS 变量等于每秒改 60 次样式，
 *  所以：rAF 节流 + 低通平滑（新值只取三成，其余走旧值）。
 *  平滑不只是省性能 —— 不平滑的话手一抖画面就跟着抖，那是"故障感"不是"跟随感"。
 * ========================================================================== */
(function () {
  'use strict';
  var H = window.HENAN;
  if (!H) return;

  var supported = typeof window.DeviceOrientationEvent !== 'undefined';
  var active = false;      // 监听已挂上
  var granted = false;
  var sx = 0, sy = 0;      // 平滑后的值，-1 ~ 1
  var tx = 0, ty = 0;      // 目标值
  var raf = 0;

  /* 弧度到 -1~1 的映射范围：±25°。
     给太大会让"轻轻一动就甩到底"，给太小又得像端着罗盘一样举着手机。
     25° 大约是手腕自然转动的幅度。 */
  var RANGE = 25;

  /* 手机竖着拿时的自然俯角约 40~50°，取 45 做中点。
     不减掉这个基准，前后倾斜会一直顶在一端。 */
  var BETA_MID = 45;

  function clamp1(v) { return v < -1 ? -1 : v > 1 ? 1 : v; }

  function frame() {
    raf = 0;
    if (!active) return;
    // 低通：新值只吃三成。见文件头"性能"那段 —— 这同时是手感的一部分
    sx += (tx - sx) * 0.3;
    sy += (ty - sy) * 0.3;
    var root = document.documentElement;
    root.style.setProperty('--tilt-x', sx.toFixed(3));
    root.style.setProperty('--tilt-y', sy.toFixed(3));
    // 静止下来就别再空转 rAF（差值小到看不出来就停）
    if (Math.abs(tx - sx) > 0.002 || Math.abs(ty - sy) > 0.002) {
      raf = requestAnimationFrame(frame);
    } else {
      sx = tx; sy = ty;
      root.style.setProperty('--tilt-x', sx.toFixed(3));
      root.style.setProperty('--tilt-y', sy.toFixed(3));
    }
  }

  function wake() { if (!raf) raf = requestAnimationFrame(frame); }

  function onOrient(e) {
    if (e.gamma == null || e.beta == null) return;

    // 横屏时屏幕坐标转过了 90°，两个轴要跟着换，否则"左右倾"会变成"前后倾"
    var ang = 0;
    try { ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0; } catch (err) { ang = 0; }
    ang = ((ang % 360) + 360) % 360;

    var g = e.gamma, b = e.beta - BETA_MID;
    var x, y;
    if (ang === 90)       { x =  b; y = -g; }
    else if (ang === 180) { x = -g; y = -b; }
    else if (ang === 270) { x = -b; y =  g; }
    else                  { x =  g; y =  b; }

    tx = clamp1(x / RANGE);
    ty = clamp1(y / RANGE);
    wake();
  }

  function attach() {
    if (active) return;
    active = true;
    window.addEventListener('deviceorientation', onOrient, { passive: true });
  }

  /* 申请并开始。只应由**用户手势**调用一次（见文件头第 1 条）。 */
  function request() {
    if (active) return;
    if (!supported) return;                 // 桌面浏览器：静默什么都不做
    if (H.reduceMotion) return;             // 减动效：连问都不问，直接不开

    /* iOS 13+ 的路径 */
    if (typeof window.DeviceOrientationEvent.requestPermission === 'function') {
      try {
        window.DeviceOrientationEvent.requestPermission().then(function (res) {
          if (res === 'granted') { granted = true; attach(); }
          /* 拒绝就到此为止。不弹提示、不再问 —— 见文件头第 2 条。 */
        }, function () { /* 抛异常同样只是"没开成" */ });
      } catch (e) { /* 某些 webview 上会直接抛，一样忽略 */ }
      return;
    }

    /* 安卓与桌面：不需要权限，直接挂。挂上之后如果一直没有事件，
       active 会保持 true 但 sx/sy 一直是 0 —— 那正是我们要的"什么都不做"。 */
    attach();
  }

  /* 系统设置改成"减少动效"时，把已经倾斜的画面归位并停掉。
     与 15-ink.js 里那段同理：偏好是可能中途变的。 */
  H.on('chapter:enter', function () {
    if (!H.reduceMotion) return;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (active) {
      window.removeEventListener('deviceorientation', onOrient);
      active = false;
    }
    sx = sy = tx = ty = 0;
    var root = document.documentElement;
    root.style.setProperty('--tilt-x', '0');
    root.style.setProperty('--tilt-y', '0');
  });

  /* #tilt=0.8,-0.5 —— 把倾斜值**钉死**成给定值，好把"歪着看"的样子拍下来。
     为什么需要：这个功能在桌面无头浏览器里**完全测不了** ——
     deviceorientation 不会触发（没有传感器），而整套视差与微倾的观感
     恰恰只能靠眼睛判断。这个钩子把"只能上真机才能看"的那部分，
     变成了"至少构图能拍下来核对"。
     真机上仍必须验：无头测不了的从来不是数值，是手感。 */
  if (H.dbg.tilt) {
    var p = String(H.dbg.tilt).split(',');
    var fx = parseFloat(p[0]), fy = parseFloat(p[1]);
    if (isFinite(fx) || isFinite(fy)) {
      H.wait(60).then(function () {
        var root = document.documentElement;
        root.style.setProperty('--tilt-x', (isFinite(fx) ? fx : 0).toFixed(3));
        root.style.setProperty('--tilt-y', (isFinite(fy) ? fy : 0).toFixed(3));
      });
    }
  }

  H.tilt = {
    request: request,
    get on() { return active; },
    get granted() { return granted; }
  };
})();

</script>
<script data-from="assets/js/30-gate.js">
/* ============================================================================
 *  30-gate.js —— 序 · 大门：开门时序
 *
 *  时序（每一步都由上一步的 transitionend 或绝对时间推进，不用嵌套 setTimeout 堆叠）：
 *    点击 → 微回弹(160ms) → 门扇转开(2.5s) → 门后文字浮现 → 入卷
 * ========================================================================== */
(function () {
  'use strict';

  var H = window.HENAN;
  if (!H) return;

  var gate, doors, stage, hints = [];
  var opened = false;

  /* 种子随机：粒子构图每次刷新都一致。
     用 Math.random 的话，每次截图都不一样，就没法靠截图判断"改动是好是坏"。 */
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function buildDust() {
    var host = H.$('.gate__dust');
    if (!host || H.reduceMotion) return;
    var rand = mulberry(20260926);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 30; i++) {
      var m = document.createElement('span');
      m.className = 'gate__mote';
      m.style.setProperty('--x', (rand() * 100).toFixed(2) + '%');
      m.style.setProperty('--sz', (1.3 + rand() * 2.9).toFixed(2) + 'px');
      m.style.setProperty('--dur', (11 + rand() * 14).toFixed(2) + 's');
      // 负延迟：负值让粒子在动画中段起步，一进场就有层次，而不是齐刷刷从地面升起
      m.style.setProperty('--delay', (-rand() * 22).toFixed(2) + 's');
      m.style.setProperty('--drift', ((rand() * 2 - 1) * 78).toFixed(0) + 'px');
      frag.appendChild(m);
    }
    host.appendChild(frag);
  }

  /* 推开一条缝之后，门扇开始转。这里用 setTimeout 是**为了让门扇的
     transition 有机会启动**（改 class → 下一帧过渡才生效），不是为了排音频。
     音频一律走绝对时间，见 10-audio.js。 */
  function open() {
    if (opened) return;
    opened = true;

    // 第一个用户手势：唤醒 AudioContext（浏览器的自动播放策略要求）
    if (H.audio) H.audio.creak();

    /* 同一个手势里顺手把陀螺仪权限也要了（iOS 13+ 只认用户手势）。
       挂在这里而不是进页面就问，理由见 18-tilt.js 顶部：
       到这一步观众已经决定要看下去了，此刻提请求才不算拦路。
       桌面上这个调用会立刻返回，什么也不会发生。 */
    if (H.tilt) H.tilt.request();

    // 推门那一下给一点震动。不支持的设备静默无效（H.buzz 内部已兜住）
    H.buzz(18);

    gate.classList.add('is-pushing');
    H.emit('gate:push');
    // 门轴吱呀的音长 1.55s，此时门刚开始转，声画是同步起步的
    setTimeout(function () {
      gate.classList.remove('is-pushing');
      gate.classList.add('is-open');
      H.emit('gate:open');
    }, 160);

    // 门扇转 2.5s；转到 90° 出头（约 1.15s）时门后已经能看见东西了
    setTimeout(function () {
      gate.classList.add('is-revealed');
      H.emit('gate:revealed');
      if (H.audio) H.audio.gong(98, 0.5);       // 一声低沉的钟，把"入场"钉住
    }, 1350);

    // 主动入卷。给足时间看门后文字，但不等观众点 —— 评委多半是"看"而不是"点"
    if (H.dbg.stay !== '1') {
      setTimeout(function () { H.go('map'); }, 5200);
    }
  }

  /* 已经开过门之后，点画面任意处提前入卷（别让急性子等） */
  function skip() {
    if (!opened) return;
    if (H.current() === 'gate') H.go('map');
  }

  function init() {
    stage = document.getElementById('stage-gate');
    gate = H.$('.gate', document.body);
    doors = document.getElementById('gateDoors');
    if (!stage || !gate || !doors) return;

    buildDust();

    doors.addEventListener('click', open);
    doors.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
    stage.addEventListener('click', function (e) {
      // 门扇上的点击由上面的 handler 处理；这里管"已经开了、点别处跳过"
      if (e.target === doors || doors.contains(e.target)) return;
      skip();
    });

    // 调试：直接落到"已开门"的状态，方便截图核对门后文字与天光
    if (H.dbg.gate === 'open') {
      setTimeout(function () {
        gate.classList.add('is-open');
        setTimeout(function () { gate.classList.add('is-revealed'); }, 1200);
      }, 120);
    }
  }

  H.chapter('gate', {
    enter: function () {
      // 从别的章回到序章：把门关回去，允许重看
      if (opened && H.dbg.stay === '1') {
        opened = false;
        gate.classList.remove('is-open', 'is-revealed');
      }
    },
    leave: function () {}
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();

</script>
<script data-from="assets/js/40-map.js">
/* ============================================================================
 *  40-map.js —— 壹 · 形
 *
 *  一片绢本上的河南：18 个地级市按真实边界分片，**不设按钮**，直接点分片。
 *  点开是一张"古今对照"卡片：两个名字、两座建筑、两段文字。
 *
 *  三条纪律：
 *   1. 悬停高亮走"预置副本 + 只切 opacity"，**不用 filter: drop-shadow**
 *      —— 每种新值都要重新光栅化 6000 点的 path，必掉帧。
 *   2. 命中由浏览器按真实几何算。小市（济源 76px / 鹤壁 80px）另铺一层
 *      透明加宽描边的"命中层"，视觉与命中解耦。
 *   3. 读 rect 只在 pointerdown / 开卡片时做，拖拽过程中零 layout 读取。
 * ========================================================================== */
(function () {
  'use strict';

  var H = window.HENAN;
  if (!H) return;

  var NS = 'http://www.w3.org/2000/svg';
  var $ = H.$, $$ = H.$$, el = H.el, clamp = H.clamp;

  /* 绢本四色循环。刻意都压在低饱和区 —— 一旦颜色跳出来，这张图就从
     "古籍地图"变成"数据大屏"了。

     分片之间的界线：原先靠一道墨色描边交代，现已取消（用户要求去掉墨线效果），
     改走**纯靠色差**这条路。18 座城由这四色循环填出，相邻不同色，边界自己读得出来。

     ⚠️ 这四个色值挨得很近（#e6d8b7 ~ #cab486）。没有描边之后，差异是"够读"
        还是"糊成一团"以实拍截图为准；不够就把这四个值拉开，
        **不要**把描边加回来 —— 那正是被取消的东西。 */
  var FILLS = ['#e6d8b7', '#ddcba7', '#d4c096', '#cab486'];

  var built = false;
  var svg, card, showcase, bar, labels = null, cities = null;
  var byCode = Object.create(null);   // adcode -> { path, glow, label }
  var hovered = null, opened = null;
  /* 开卡片时焦点在谁身上。关卡片时要还回去 —— 见 closeCard 里的说明。 */
  var from = null;

  /* ---------- 小工具 ---------- */
  function svgEl(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    return n;
  }

  /* Catmull-Rom → 三次贝塞尔：黄河那条线只有 17 个点，直连会是一串折角，
     平滑之后才像"手绘的一条河"。 */
  function smooth(pts, tension) {
    if (pts.length < 2) return '';
    var t = tension == null ? 0.5 : tension;
    var d = 'M' + pts[0][0] + ',' + pts[0][1];
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i];
      var p1 = pts[i], p2 = pts[i + 1];
      var p3 = pts[i + 2] || p2;
      var c1x = p1[0] + (p2[0] - p0[0]) / 6 * t * 2;
      var c1y = p1[1] + (p2[1] - p0[1]) / 6 * t * 2;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6 * t * 2;
      var c2y = p2[1] - (p3[1] - p1[1]) / 6 * t * 2;
      d += 'C' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' +
                 c2x.toFixed(1) + ',' + c2y.toFixed(1) + ' ' +
                 p2[0] + ',' + p2[1];
    }
    return d;
  }

  /* 图片地址解析：真实的扩展名与版权信息在 assets/data/photos.js（由抓图清单生成）。
     那份文件还没生成时退回约定路径，页面照样能跑 —— 只是没有署名数据。 */
  function photo(key) {
    var p = (H.photos || {})[key];
    return p || { src: __IMG('assets/img/map/' + key + '.jpg') };
  }

  function cityData(adcode) { return (cities || {})[adcode] || null; }

  /* ---------- 建图 ---------- */
  function build(stage) {
    if (built) return;
    var map = H.map;                      // ← 烘焙好的几何数据（henan-map.js）
    if (!map || !map.cities) { console.warn('40-map: 缺少地图数据'); return; }
    cities = H.cities || {};

    var root = el('div', 'map');
    root.innerHTML =
      '<header class="map__head">' +
        '<span class="map__num t-label">壹</span>' +
        '<h2 class="map__title t-display">形</h2>' +
        '<p class="map__sub t-note">十八城，各点一方水土 —— 看它的古今两副面孔</p>' +
      '</header>' +
      '<div class="map__stage"><div class="map__mount"></div></div>' +
      '<p class="map__legend t-label"><i></i>黄河</p>';

    var mount = $('.map__mount', root);

    svg = svgEl('svg', {
      class: 'map__svg',
      viewBox: map.viewBox,
      preserveAspectRatio: 'xMidYMid meet',
      role: 'group',
      'aria-label': '河南省十八地市分片图'
    });

    /* 纸底：一层绢色 + 一层淡淡的晕。用 <rect> 而不是 CSS 背景，
       这样它会跟着 viewBox 一起缩放，纸纹不会随窗口大小变形。 */
    var paper = svgEl('g', { class: 'map__paper' });
    paper.appendChild(svgEl('rect', { x: 0, y: 0, width: map.width, height: map.height, fill: 'url(#mapPaper)' }));
    paper.appendChild(svgEl('path', { class: 'map__river map__river--glow', d: '' }));
    svg.appendChild(paper);

    var land = svgEl('g', { class: 'map__land' });

    /* ① 填色层：就是真正参与命中测试的那一层 */
    var fills = svgEl('g', { class: 'map__fills' });
    /* ② 朱砂内晕副本：预先光栅化好，悬停时只切 opacity（走合成器，零重绘） */
    var glows = svgEl('g', { class: 'map__glows', 'aria-hidden': 'true' });
    /* ③ 命中加宽层：透明描边，专治小市难点中 */
    var hits = svgEl('g', { class: 'map__hits' });
    labels = svgEl('g', { class: 'map__labels', 'aria-hidden': 'true' });

    map.cities.forEach(function (c, i) {
      var code = c.adcode;

      var glow = svgEl('path', { class: 'map__glow', d: c.d, fill: '#9e2b25' });
      glow.setAttribute('filter', 'url(#inkbleed-s)');
      glows.appendChild(glow);

      var fill = FILLS[c.fill % FILLS.length];
      var p = svgEl('path', {
        class: 'city',
        d: c.d,
        fill: fill,
        /* 同色描边：只为补相邻路径之间的抗锯齿缝，不是界线（理由见 FILLS 上的注释）。
           必须是**呈现属性**而不是写进 CSS —— 每一块的颜色都不同，
           CSS 里没法一处写清；而 CSS 又会盖掉属性，所以 map.css 的 .city 里
           特意不写 stroke。 */
        stroke: fill,
        'data-adcode': code,
        tabindex: '0',
        role: 'button'
      });
      p.style.setProperty('--i', i);
      var cd = cityData(code);
      var nm = cd ? cd.short : c.short;
      p.setAttribute('aria-label', nm + '，点击查看古今对照');
      fills.appendChild(p);

      // 命中带：和填色层同形，只是描边加粗到 ±8px。放在最上面，
      // 免得被邻市的大分片盖住按不动。
      var hit = svgEl('path', { class: 'map__hit', d: c.d, 'data-adcode': code });
      hits.appendChild(hit);

      var label = svgEl('text', {
        class: 'map__label',
        x: c.labelX, y: c.labelY,
        'text-anchor': 'middle',
        'dominant-baseline': 'middle',
        'data-adcode': code
      });
      label.textContent = nm;
      labels.appendChild(label);

      byCode[code] = { path: p, glow: glow, label: label, meta: c, data: cd };
    });

    land.appendChild(fills);
    land.appendChild(glows);

    // 黄河：石青虚线，横穿三门峡→洛阳→郑州→开封→濮阳。一条 path 的成本，
    // 对"这是河南"的气韵提升极大。
    if (map.river && map.river.length) {
      var rd = smooth(map.river);
      land.appendChild(svgEl('path', { class: 'map__river', d: rd }));
      var riverGlow = $('.map__river--glow', paper);
      if (riverGlow) riverGlow.setAttribute('d', rd);
    }

    land.appendChild(labels);
    land.appendChild(hits);
    svg.appendChild(land);
    mount.appendChild(svg);

    /* 卡片：DOM 只建一次，之后每次开卡片只改文字与图片 src */
    card = buildCard();
    root.appendChild(card.root);

    stage.appendChild(root);
    bindMap(root, mount);
    built = true;
  }

  /* ---------- 卡片骨架 ---------- */
  function buildCard() {
    var root = el('article', 'card');
    root.id = 'mapCard';
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-modal', 'false');

    root.innerHTML =
      '<button class="card__close" type="button" aria-label="关闭卡片">×</button>' +
      '<header class="card__head">' +
        '<div class="card__names">' +
          '<h3 class="card__now t-display"></h3>' +
          '<p class="card__then t-kai"><span class="card__ancient"></span>' +
            '<span class="card__dyn"></span></p>' +
        '</div>' +
        '<span class="card__seal seal seal--sm t-kai"></span>' +
      '</header>' +
      '<p class="card__line t-note"></p>' +
      '<div class="showcase" data-mode="split">' +
        '<figure class="shot shot--then">' +
          '<div class="pic skeleton"><img class="pic__img img-in" alt="" decoding="async"></div>' +
          '<figcaption class="shot__cap"><b class="shot__tag">古</b>' +
            '<span class="shot__name"></span><span class="shot__era"></span></figcaption>' +
        '</figure>' +
        '<figure class="shot shot--now">' +
          '<div class="pic skeleton"><img class="pic__img img-in" alt="" decoding="async"></div>' +
          '<figcaption class="shot__cap"><b class="shot__tag">今</b>' +
            '<span class="shot__name"></span><span class="shot__era"></span></figcaption>' +
        '</figure>' +
        '<span class="showcase__bar" role="slider" tabindex="0" aria-label="古今对比位置"' +
          ' aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i></i></span>' +
        '<span class="showcase__cue t-label">拖动对比</span>' +
      '</div>' +
      '<div class="card__pair">' +
        '<div class="card__side card__side--then">' +
          '<h4 class="card__side-h t-kai"></h4><p class="card__desc t-note"></p>' +
        '</div>' +
        '<div class="card__side card__side--now">' +
          '<h4 class="card__side-h t-kai"></h4><p class="card__desc t-note"></p>' +
        '</div>' +
      '</div>' +
      '<footer class="card__foot">' +
        '<button class="card__toggle btn" type="button"></button>' +
        '<p class="card__note t-label"></p>' +
      '</footer>';

    var api = {
      root: root,
      now: $('.card__now', root),
      ancient: $('.card__ancient', root),
      dyn: $('.card__dyn', root),
      seal: $('.card__seal', root),
      line: $('.card__line', root),
      showcase: $('.showcase', root),
      toggle: $('.card__toggle', root),
      note: $('.card__note', root),
      then: {
        img: $('.shot--then .pic__img', root),
        pic: $('.shot--then .pic', root),
        name: $('.shot--then .shot__name', root),
        era: $('.shot--then .shot__era', root),
        h: $('.card__side--then .card__side-h', root),
        desc: $('.card__side--then .card__desc', root)
      },
      nowS: {
        img: $('.shot--now .pic__img', root),
        pic: $('.shot--now .pic', root),
        name: $('.shot--now .shot__name', root),
        era: $('.shot--now .shot__era', root),
        h: $('.card__side--now .card__side-h', root),
        desc: $('.card__side--now .card__desc', root)
      }
    };
    return api;
  }

  /* ---------- 开卡片 ---------- */
  function fillSide(side, lm, key, alt) {
    var ph = photo(key);
    side.pic.classList.remove('is-failed');
    side.img.classList.remove('is-loaded');
    side.img.removeAttribute('src');
    side.img.removeAttribute('data-src');
    side.img.alt = (lm && lm.name) || alt;
    side.img.style.setProperty('--pos', ph.pos || '50% 32%');
    /* 有图走加载，没图就直接落到"暂缺"态。
       不能不管：H.loadImage 见到空 src 会原样返回，.pic 上的 skeleton
       于是留了下来 —— 那块流光本来是给"正在加载"看的，
       照片不来了还挂着，就成了一直转圈的空方块。 */
    if (H.isMissingPhoto(key)) {
      side.pic.classList.remove('skeleton', 'is-failed');
      side.pic.classList.add('is-blank');
    } else {
      side.pic.classList.remove('is-blank');
      H.loadImage(side.img, ph.src);
    }
    side.name.textContent = (lm && lm.name) || '—';
    side.era.textContent = (lm && lm.era) || '';
    side.h.textContent = alt + ' · ' + ((lm && lm.name) || '—');
    side.desc.textContent = (lm && lm.desc) || '';
  }

  /* 定位：量 offsetWidth/Height（**不受 transform 影响**，所以不必先清 transform
     再读 rect —— 那会多一次强制重排），夹进视口，然后把位置写成 --x/--y。
     刻意不直接写 transform：入场缩放也住在 transform 里，两边都写就会互相覆盖。 */
  function place() {
    if (!card) return;
    var w = card.root.offsetWidth, h = card.root.offsetHeight;
    var vw = window.innerWidth, vh = window.innerHeight;
    var M = 16;
    card.root.style.setProperty('--x',
      Math.round(clamp(vw / 2 - w / 2, M, Math.max(M, vw - w - M))) + 'px');
    card.root.style.setProperty('--y',
      Math.round(clamp(vh / 2 - h / 2, M, Math.max(M, vh - h - M))) + 'px');
  }

  function openCity(adcode) {
    if (!built || !card) return;
    var rec = byCode[adcode];
    if (!rec) return;
    var d = rec.data || {};
    var lm = d.landmark || {};

    card.now.textContent = d.short || rec.meta.short;
    card.ancient.textContent = d.ancient || '';
    card.dyn.textContent = d.dynasty ? ' · ' + d.dynasty : '';
    card.seal.textContent = H.meta.map.num;

    // 古今地名对不上行政区划的（鹤壁·淇县、周口·淮阳、驻马店·汝南），
    // cities.js 的 note 里写明出处，这里必须原样带出来 —— 宁可少说不可说错。
    card.line.textContent = d.line || '';
    card.note.textContent = d.note || '';

    fillSide(card.then, lm.ancient, adcode + '-ancient', '古');
    fillSide(card.nowS, lm.modern, adcode + '-modern', '今');

    // 古名可能有别称，小的补在括号里
    if (d.ancientAlt && d.ancientAlt.length) {
      card.ancient.textContent = d.ancient + '（' + d.ancientAlt.slice(0, 2).join('、') + '）';
    }

    opened = adcode;
    setActive(adcode);
    place();
    card.root.classList.add('is-on');
    /* 这一声是形章**唯一**的动作反馈。从前借的是泛用 blip(1046,.4)，
       峰值 0.028，是全站最轻的一处 —— 轻到听不见（详见 10-audio.js 的 mapPick）。
       现改用 mapPick()：音高还是 1046，多了木头的腔与分量。 */
    if (!H.reduceMotion && H.audio) H.audio.mapPick();

    // 焦点交给关闭键，键盘用户不至于"打开后还在原地"。
    /* 记住是谁打开的，关的时候还回去（见 closeCard）。
       键盘用户用地级市 path 打开卡片后，焦点必须能回到那一片上 ——
       否则按 Esc 关闭，焦点掉回 <body>，想再看隔壁那座城得从页首 Tab 十几下。 */
    from = document.activeElement;
    // ⚠️ 这里**不该**看 H.reduceMotion。原先的条件是 `cl && !H.reduceMotion`，
    //    等于"开了减少动效的键盘用户，打开卡片后焦点留在原地"——
    //    把"少动效"和"焦点管理"混成了一件事：前者是视觉偏好，后者是无障碍的基本盘，
    //    两者没有任何关系。实测：系统开了减少动效时，卡片打开后 Tab 会跑到卡片**背后**的地图上。
    var cl = $('.card__close', card.root);
    if (cl) cl.focus({ preventScroll: true });

    H.emit('map:city-open', { adcode: adcode });
  }

  /* 用 is-on + visibility 而不是 hidden/display:none：
     display 从 none 翻回来的同一帧里加 class，浏览器没有"变化前"的样式可插值，
     过渡根本不会跑（卡片会直接蹦出来）。 */
  function closeCard() {
    if (!card || !card.root.classList.contains('is-on')) return;
    card.root.classList.remove('is-on');
    opened = null;
    setActive(null);
    /* 焦点还原。味章的膳单（50-scroll.js）与图片来源页（80-credits.js）都做对了这件事，
       只有地图这一章漏了 —— 照同一套做法补上。
       preventScroll 是必须的：还原焦点会顺带把卡片滚回视野，
       而此时卡片正在淡出，画面会抽一下。 */
    if (from && from.focus) {
      try { from.focus({ preventScroll: true }); } catch (e) { /* 老浏览器忽略 */ }
    }
    from = null;
    H.emit('map:city-close', {});
  }

  /* ---------- 高亮 ---------- */
  /* 只在"上一个目标和这次不同"时才动手。鼠标在同一片里挪动会触发几十次
     pointermove，每次无脑重写 3 个 class 是白白让样式引擎反复失效。 */
  function setHover(adcode) {
    if (hovered === adcode) return;
    paint(hovered, false);
    hovered = adcode;
    paint(adcode, true);
  }

  function setActive(adcode) {
    $$('.city.is-active, .map__glow.is-active, .map__label.is-active', svg)
      .forEach(function (n) { n.classList.remove('is-active'); });
    if (adcode != null) {
      var r = byCode[adcode];
      if (r) { r.path.classList.add('is-active'); r.glow.classList.add('is-active'); r.label.classList.add('is-active'); }
    }
  }

  function paint(adcode, on) {
    if (adcode == null) return;
    var r = byCode[adcode];
    if (!r) return;
    r.path.classList.toggle('is-hover', on);
    r.glow.classList.toggle('is-hover', on);
    r.label.classList.toggle('is-hover', on);
    // 悬停就让地图之外也知道"现在指的是哪一市"，将来要接别的联动有地方挂
    H.emit('map:hover', { adcode: on ? adcode : null });
  }

  /* ---------- 事件绑定 ---------- */
  function bindMap(root, mount) {
    /* 用**委托**而不是给 18 个 path 各挂一套监听：
       hit 层在 fills 之上，pointerover 会冒泡到 svg，一次就够。 */
    svg.addEventListener('pointerover', function (e) {
      var n = e.target.closest ? e.target.closest('.city, .map__hit') : null;
      if (n) setHover(+n.dataset.adcode);
    });
    svg.addEventListener('pointerout', function (e) {
      var to = e.relatedTarget;
      if (!to || !to.closest || !to.closest('.city, .map__hit')) setHover(null);
    });

    function activate(e) {
      var n = e.target.closest ? e.target.closest('.city, .map__hit') : null;
      if (!n) return;
      e.preventDefault();
      openCity(+n.dataset.adcode);
    }
    svg.addEventListener('click', activate);
    svg.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') activate(e);
    });

    /* 点空白关闭：**捕获阶段**挂在整章上。
       卡片内部、地图分片上的 pointerdown 都要放行，其余一律关。 */
    var stage = document.getElementById('stage-map');
    stage.addEventListener('pointerdown', function (e) {
      if (!opened) return;
      if (e.target.closest && e.target.closest('.card')) return;
      if (e.target.closest && e.target.closest('.city, .map__hit')) return;
      closeCard();
    }, true);

    H.on('ui:escape', function () { closeCard(); });

    /* 视口一变，卡片可能已经在框外了，重新夹一次。
       地名的字号同理 —— 地图的渲染尺寸跟着视口走，缩放比就变了。 */
    H.on('ui:resize', function () { if (opened) place(); fitLabels(); });

    bindShowcase(root);
    bindCardUI(root);

    // #hover=411300 直接把某市置于悬停态，好把"朱砂内晕"拍下来核对
    if (H.dbg.hover) H.wait(300).then(function () { setHover(+H.dbg.hover); });
  }

  /* ---------- 古今对比：并置 / 叠加拖动 ---------- */
  function bindCardUI(root) {
    $('.card__close', root).addEventListener('click', closeCard);

    var sc = card.showcase;
    var toggle = card.toggle;
    function syncToggle() {
      var slide = sc.dataset.mode === 'slide';
      toggle.textContent = slide ? '并置两张' : '叠加重合';
      sc.classList.toggle('is-slide', slide);
    }
    toggle.addEventListener('click', function () {
      sc.dataset.mode = sc.dataset.mode === 'slide' ? 'split' : 'slide';
      syncToggle();
      /* 卡片里"并置 / 叠加"的切换。同一个形章里的第二种点击，仍用泛用 blip，
         但要跟上面那一声拉开层次：给到 0.9（峰值 0.063），
         还明显轻于点城的 mapPick（0.20），听得出"这是次要的那个"。 */
      if (H.audio) H.audio.blip(880, 0.9);
    });
    // 悬停与叠加模式在无头截图里都够不着（没有鼠标、也不会去点开关），
    // 各留一个调试钩子，好把这两种状态拍下来核对
    if (H.dbg.slide) sc.dataset.mode = 'slide';
    syncToggle();
  }

  function bindShowcase(root) {
    var sc = card.showcase;
    var bar = $('.showcase__bar', sc);
    var drag = false, box = null, pct = 50;

    function apply(p) {
      pct = clamp(p, 0, 100);
      // --cut 是"古人像露出来的部分"：clip-path: inset(0 var(--cut) 0 0)
      sc.style.setProperty('--cut', (100 - pct) + '%');
      sc.style.setProperty('--x', pct + '%');
      bar.setAttribute('aria-valuenow', Math.round(pct));
    }

    function fromEvent(e) {
      if (!box) return;
      apply((e.clientX - box.left) / box.width * 100);
    }

    /* rect 只在按下的那一刻读一次 —— 拖动过程中一次 layout 都不读 */
    function down(e) {
      drag = true;
      box = sc.getBoundingClientRect();
      if (bar.setPointerCapture && e.pointerId != null) {
        try { bar.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      }
      fromEvent(e);
      e.preventDefault();
    }
    function move(e) { if (drag) fromEvent(e); }
    function up() { drag = false; box = null; }

    sc.addEventListener('pointerdown', down);
    sc.addEventListener('pointermove', move);
    sc.addEventListener('pointerup', up);
    sc.addEventListener('pointercancel', up);
    window.addEventListener('pointerup', up);

    // 键盘：方向键微调，Shift 加速
    bar.addEventListener('keydown', function (e) {
      var step = e.shiftKey ? 10 : 2;
      if (e.key === 'ArrowLeft') { apply(pct - step); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { apply(pct + step); e.preventDefault(); }
    });

    apply(50);
  }

  /* ---------- 地名大小 ---------- */
  /* 字号必须按**地图实际渲染出来的缩放比**反推，不能写死在 CSS 里 ——
     写死会把两个极端都弄错：1600×900 上地图高约 790px，18 用户单位 ≈ 15px（正好）；
     390 宽的竖屏上地图只剩约 220px 高，同一个 18 单位只有 **4px**，成了一排灰点。
     中间差的是"地图被画得多大"。

     ⚠️ 而这件事**不能用 pointer:coarse 判**：把桌面窗口缩窄，用鼠标一样看不清；
        反过来大屏平板是粗指针，却根本不缺这一档字号。
        判据只能是几何 —— 量 SVG 的实际尺寸、除以 viewBox 尺寸，得到
        用户单位到像素的比，再反推该写多少用户单位。 */
  function fitLabels() {
    if (!svg || !labels) return;
    var r = svg.getBoundingClientRect();
    var vb = String((H.map && H.map.viewBox) || '0 0 1000 954').split(/\s+/).map(Number);
    if (!r.width || !r.height || !vb[2] || !vb[3]) return;

    /* preserveAspectRatio="xMidYMid meet"：取两个方向里**较小**的缩放比，另一边留白。
       用 max 会算出偏大的字号，字就顶出分片了。 */
    var scale = Math.min(r.width / vb[2], r.height / vb[3]);
    if (!(scale > 0)) return;

    // 目标屏幕字号随地图高度轻微浮动（大地图上太小的字显得怯），但压住下限 11px
    var px = H.clamp(r.height * 0.026, 11, 17);
    labels.style.setProperty('--label-size', (px / scale).toFixed(2) + 'px');
    // 光晕按同比例给，否则字号一大，光晕相对就细成一条线，字又糊回分片里
    labels.style.setProperty('--label-halo', (px / scale * 0.19).toFixed(2) + 'px');
  }

  /* ---------- 章节生命周期 ---------- */
  H.chapter('map', {
    enter: function (e) {
      var stage = document.getElementById('stage-map');
      if (!built) build(stage);
      /* 必须在舞台**可见之后**才量。非激活章节是 visibility:hidden，
         getBoundingClientRect 全返回 0，量不出缩放比。
         （00-core.js 是先加 is-on 再调 enter，所以这里量得到；
           仍补一个 rAF 是防字体替换/布局延迟导致首帧尺寸不准。） */
      fitLabels();
      requestAnimationFrame(fitLabels);
      // 首帧建完 DOM 再加 class，入场横扫才有起点
      if (e && e.first) H.wait(30).then(function () { stage.classList.add('is-armed'); });
      else stage.classList.add('is-armed');
      H.emit('map:enter');
    },
    leave: function () {
      closeCard();
      setHover(null);
      H.emit('map:leave');
    }
  });

  /* 深链：#debug=map&city=410100 由 70-boot.js 发出这个事件 */
  H.on('map:open-city', function (d) { if (d && d.adcode) openCity(+d.adcode); });

  /* ⚠️ 绝不能叫 H.map —— HENAN.map 是 henan-map.js 烘焙出来的**几何数据**
     （viewBox + 18 个分片的 path）。在这里覆盖它，build() 就会把本对象当成地图数据，
     找不到 cities，整张图静默地什么都不画。接口另起一个名字。 */
  H.mapUI = {
    built: function () { return built; },
    openCity: openCity,
    close: closeCard,
    hover: setHover
  };
})();

</script>
<script data-from="assets/js/50-scroll.js">
/* ============================================================================
 *  50-scroll.js —— 叁 · 味（中原美食录）
 *
 *  一条近 9000px 的长卷，十八市各占一版。
 *  三件事是这一章的手感核心，其余都是配套：
 *    · scroll-snap 离散吸附 —— 纯自由横向滚动会漏看六成内容
 *    · pointer 拖拽 —— 鼠标用户没有横向滚轮，不给他们拖就没法看
 *    · 底部 18 枚朱砂小印 —— 既当进度又当跳转
 * ========================================================================== */
(function () {
  'use strict';
  var H = window.HENAN;
  if (!H) return;

  var built = false;
  var viewport, track, seals, sheet, dishes = [], seen = Object.create(null);
  var opened = null;       // 当前膳单对应的 adcode
  var armed = false;

  /* ---------- 数据 ---------- */
  function list() { return H.food || []; }

  /* 小印上只刻一个字。方印塞两字必然折行 ——「郑州」会摊成上下两行，
     整排看着像乱码（实测过，十八枚全是两行的）。
     十八市的**首字**恰好两两不同，取首字就够分辨，全名留在 title 里。

     只有三门峡要改：「三」是个数字，刻在印上认不出是哪座城，
     用「峡」—— 十八市里也只它带这个字。 */
  var SHORT = { 411200: '峡' };
  function shortOf(d) { return SHORT[d.adcode] || String(d.city || '').slice(0, 1); }

  /* 图片：优先用 process-images.py 生成的 HENAN.photos（带署名与取景），
     没有就退回 food.js 里的 img 字段。两者指向同一路径，但前者信息更全。 */
  function photo(d) {
    var p = (H.photos || {})[d.adcode + '-food'];
    if (p && p.src) return p;
    return { src: d.img || (__IMG('assets/img/food/' + d.adcode + '-food.jpg')), pos: '50% 50%' };
  }

  /* ---------- 建 DOM（首次进本章才建） ---------- */
  function build(stage) {
    if (built) return;
    var data = list();
    if (!data.length) { console.warn('50-scroll: 缺少美食数据'); return; }

    var root = H.el('div', 'scroll');
    root.innerHTML =
      '<header class="scroll__head">' +
        '<span class="scroll__num t-label">叁</span>' +
        '<h2 class="scroll__title t-kai">中原美食录</h2>' +
        '<p class="scroll__sub t-label">十八城 · 一味一风土</p>' +
        '<p class="scroll__hint t-label">拖拽或滚轮浏览 · 点击查看膳单</p>' +
      '</header>' +
      '<div class="scroll__stage">' +
        '<div class="scroll__viewport"><div class="scroll__track"></div></div>' +
        /* 两根木轴不进滚动容器 —— 它们必须钉死在视口边缘。
           放进容器里就得靠 position:sticky 去抵消滚动，多一层不定因素；
           直接放在容器外的兄弟节点上，"纸从轴上卷过"这个错觉最稳。 */
        '<div class="scroll__rod scroll__rod--l" aria-hidden="true"></div>' +
        '<div class="scroll__rod scroll__rod--r" aria-hidden="true"></div>' +
      '</div>' +
      '<nav class="scroll__seals" aria-label="按城市跳转"></nav>';

    stage.appendChild(root);
    viewport = H.$('.scroll__viewport', root);
    track = H.$('.scroll__track', root);
    seals = H.$('.scroll__seals', root);

    /* ---- 十八版 ---- */
    data.forEach(function (d, i) {
      var art = H.el('article', 'dish');
      art.dataset.adcode = d.adcode;
      art.tabIndex = 0;
      art.setAttribute('role', 'button');
      art.setAttribute('aria-label', d.city + ' · ' + d.name + '，查看膳单');

      var ph = photo(d);
      var pic = H.picture(ph.src, d.city + ' ' + d.name, '', d.adcode + '-food');
      var pimg = H.$('.pic__img', pic);
      if (pimg) pimg.style.setProperty('--pos', ph.pos || '50% 50%');

      art.innerHTML =
        '<div class="dish__head">' +
          '<h3 class="dish__city t-kai">' + d.city + '</h3>' +
          '<span class="dish__type">' + (d.type || '') + '</span>' +
          '<span class="dish__idx">' + H.fmt(i + 1) + ' / ' + H.fmt(data.length) + '</span>' +
        '</div>';

      var picWrap = H.el('div', 'dish__pic');
      picWrap.appendChild(pic);
      picWrap.insertAdjacentHTML('beforeend',
        '<h4 class="dish__name t-kai">' + d.name + '</h4>' +
        (d.alias && d.alias.length ? '<span class="dish__alias">' + d.alias.join(' · ') + '</span>' : ''));
      art.appendChild(picWrap);

      art.insertAdjacentHTML('beforeend',
        '<div class="dish__foot">' +
          '<p class="dish__taste">' + (d.taste || '') + '</p>' +
          '<span class="dish__more">膳单</span>' +
        '</div>');

      track.appendChild(art);
      dishes.push(art);
    });

    /* ---- 底部小印：点击跳到那一版 ---- */
    data.forEach(function (d, i) {
      var b = H.el('button', 'scroll__seal', shortOf(d));
      b.type = 'button';
      b.dataset.adcode = d.adcode;
      b.title = d.city + ' · ' + d.name;
      // 无障：读屏念全名，别念成一个孤零零的「郑」
      b.setAttribute('aria-label', d.city + ' · ' + d.name);
      seals.appendChild(b);
    });

    buildSheet(stage);
    bindDrag();
    bindSealObserver();
    built = true;
  }

  /* ---------- 膳单 ---------- */
  function buildSheet(stage) {
    sheet = H.el('div', 'sheet');
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-modal', 'true');
    sheet.innerHTML =
      '<button class="sheet__close" type="button" aria-label="收起膳单">×</button>' +
      '<div class="sheet__top">' +
        '<div>' +
          '<p class="sheet__city t-label"></p>' +
          '<h3 class="sheet__name t-kai"></h3>' +
          '<p class="sheet__alias"></p>' +
          '<p class="sheet__origin"></p>' +
        '</div>' +
        '<div class="sheet__pic"></div>' +
      '</div>' +
      '<div class="sheet__rows">' +
        '<span class="sheet__k t-kai">味</span><span class="sheet__v" data-k="taste"></span>' +
        '<span class="sheet__k t-kai">材</span><div class="sheet__v sheet__tags" data-k="ing"></div>' +
      '</div>' +
      '<p class="sheet__story"></p>';
    stage.appendChild(sheet);

    H.$('.sheet__close', sheet).addEventListener('click', closeSheet);
    // 点膳单以外的空白处收起。用捕获阶段，免得被内层 stopPropagation 拦掉。
    stage.addEventListener('pointerdown', function (e) {
      if (!opened) return;
      if (sheet.contains(e.target)) return;
      if (e.target.closest && e.target.closest('.dish, .scroll__seal')) return;
      closeSheet();
    }, true);
  }

  function openSheet(adcode) {
    var d = list().filter(function (x) { return x.adcode === adcode; })[0];
    if (!d) return;
    opened = adcode;
    seen[adcode] = true;

    H.$('.sheet__city', sheet).textContent = d.city;
    H.$('.sheet__name', sheet).textContent = d.name;
    H.$('.sheet__alias', sheet).textContent = (d.alias && d.alias.length) ? d.alias.join(' · ') : '';
    H.$('.sheet__origin', sheet).textContent = d.origin || '';
    H.$('[data-k="taste"]', sheet).textContent = d.taste || '';
    H.$('.sheet__story', sheet).textContent = d.story || '';

    var tags = H.$('[data-k="ing"]', sheet);
    tags.innerHTML = '';
    (d.ingredients || []).forEach(function (t) { tags.appendChild(H.el('span', '', t)); });

    var box = H.$('.sheet__pic', sheet);
    box.innerHTML = '';
    var ph = photo(d);
    var pic = H.picture(ph.src, d.city + ' ' + d.name, '', d.adcode + '-food');
    var pimg = H.$('.pic__img', pic);
    if (pimg) pimg.style.setProperty('--pos', ph.pos || '50% 50%');
    box.appendChild(pic);

    sheet.classList.add('is-on');
    H.$('.sheet__close', sheet).focus();
    H.buzz(9);          // 翻开膳单的手感（仅安卓有效，见 00-core.js 的 H.buzz）
  }

  function closeSheet() {
    if (!opened) return;
    var back = track.querySelector('.dish[data-adcode="' + opened + '"]');
    opened = null;
    sheet.classList.remove('is-on');
    if (back && back.focus) back.focus({ preventScroll: true });
  }

  /* ---------- 拖拽滚动 ---------- */
  /* 鼠标用户没有横向滚轮，不给他们拖，这条 9000px 的卷子就只能靠底部小印跳。
     关键是把"拖"和"点"分开：位移超过 6px 就认定是拖，抬起时吞掉那一次 click，
     否则每拖一下都会顺手弹出一张膳单。 */
  function bindDrag() {
    var down = false, startX = 0, startLeft = 0, moved = false, pid = null;

    viewport.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'touch') return;      // 触屏交给原生惯性滚动，别抢
      if (e.button !== 0) return;
      down = true; moved = false; pid = e.pointerId;
      startX = e.clientX;
      startLeft = viewport.scrollLeft;
    });

    viewport.addEventListener('pointermove', function (e) {
      if (!down) return;
      var dx = e.clientX - startX;
      if (!moved && Math.abs(dx) < 6) return;     // 6px 死区：手抖不算拖
      if (!moved) {
        moved = true;
        viewport.classList.add('is-dragging');
        // 真的开始拖了才捕获指针：一上来就捕获会让普通点击也走拖拽分支
        try { viewport.setPointerCapture(pid); } catch (err) { /* 指针已失效，忽略 */ }
      }
      viewport.scrollLeft = startLeft - dx;
      e.preventDefault();
    });

    function end() {
      if (!down) return;
      down = false;
      viewport.classList.remove('is-dragging');
      try { if (pid != null) viewport.releasePointerCapture(pid); } catch (err) { /* 同上 */ }
    }
    viewport.addEventListener('pointerup', end);
    viewport.addEventListener('pointercancel', end);

    /* 拖完吞掉这一次 click。捕获阶段拦，保证在 .dish 的处理器之前生效。 */
    viewport.addEventListener('click', function (e) {
      if (!moved) return;
      moved = false;
      e.stopPropagation();
      e.preventDefault();
    }, true);

    /* 键盘：左右方向键翻一版。焦点在版上时也能用。 */
    viewport.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      var i = currentIndex() + (e.key === 'ArrowRight' ? 1 : -1);
      e.preventDefault();
      goTo(i);
    });
  }

  function currentIndex() {
    var best = 0, min = Infinity;
    dishes.forEach(function (art, i) {
      var d = Math.abs(art.offsetLeft + art.offsetWidth / 2
                       - (viewport.scrollLeft + viewport.clientWidth / 2));
      if (d < min) { min = d; best = i; }
    });
    return best;
  }

  function goTo(i) {
    i = H.clamp(i, 0, dishes.length - 1);
    var art = dishes[i];
    viewport.scrollTo({
      left: art.offsetLeft + art.offsetWidth / 2 - viewport.clientWidth / 2,
      behavior: H.reduceMotion ? 'auto' : 'smooth'
    });
  }

  /* ---------- 当前是哪一版：驱动底部小印与"看过"标记 ---------- */
  function bindSealObserver() {
    var ticking = false;
    viewport.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        ticking = false;

      });

    H.wait(60).then(syncSeals);
  }

  function syncSeals() {
    if (!seals) return;
    var i = currentIndex();
    var cur = dishes[i] && dishes[i].dataset.adcode;
    Array.prototype.forEach.call(seals.children, function (b, j) {
      var on = j === i;
      b.classList.toggle('is-current', on);
      b.setAttribute('aria-current', on ? 'true' : 'false');
      if (j <= i || seen[b.dataset.adcode]) b.classList.add('is-seen');
    });
