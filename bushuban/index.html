  }

  /* ---------- 事件 ---------- */
  function bindUI(root) {
    // 版与小印共用一个委托：点版开膳单，点印跳版
    root.addEventListener('click', function (e) {
      var seal = e.target.closest('.scroll__seal');
      if (seal) { goTo(dishes.findIndex(function (a) { return a.dataset.adcode === seal.dataset.adcode; })); return; }
      var art = e.target.closest('.dish');
      if (art) { openSheet(+art.dataset.adcode); }
    });
    root.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var art = e.target.closest && e.target.closest('.dish');
      if (!art) return;
      e.preventDefault();
      openSheet(+art.dataset.adcode);
    });
    // Esc 收膳单
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && opened) { e.stopPropagation(); closeSheet(); }
    });
  }

  /* ---------- 章节接口 ---------- */
  H.chapter('scroll', {
    enter: function (o) {
      var stage = H.stageOf('scroll');
      if (!stage) return;
      build(stage);
      if (!armed) {
        bindUI(stage);
        armed = true;
      }
      // 展开动画：下一帧加 is-armed，让 clip-path 有"之前"可以插值。
      // 同一帧里加类，浏览器找不到起始值，会直接跳到终态 —— 动画就没了。
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { stage.classList.add('is-armed'); });
      });
      H.emit('scroll:enter', o);
    },
    leave: function () {
      closeSheet();
      var stage = H.stageOf('scroll');
      if (stage) stage.classList.remove('is-armed');
      H.emit('scroll:close-detail');
    }
  });

  /* 深链：tools/shot.sh 用 #debug=scroll&dish=410100 直接把膳单拍出来。
     70-boot.js 那边是**发事件**而不是直接调本模块 —— 章节之间只通过事件总线耦合，
     谁也拿不到别人的内部对象，改一个模块不会牵动另一个。 */
  H.on('scroll:open-dish', function (e) {
    if (!e || !e.adcode) return;
    var stage = H.stageOf('scroll');
    if (!stage) return;
    build(stage);
    openSheet(+e.adcode);
  });

  /* ⚠️ 不能叫 H.scroll —— 沿用 40-map.js 那条教训：
     各章的**数据**都挂在 HENAN 下（HENAN.map / HENAN.food / HENAN.music），
     接口再用同名键覆盖，数据就会被自己的接口对象顶掉，且症状是"静默地什么都不画"。
     接口一律带 UI 后缀。 */
  H.scrollUI = {
    built: function () { return built; },
    openDish: function (adcode) { build(H.stageOf('scroll')); openSheet(adcode); },
    close: closeSheet,
    goTo: goTo,
    count: function () { return dishes.length; }
  };
})();

</script>
<script data-from="assets/js/60-sound.js">
/* ============================================================================
 *  60-sound.js —— 肆 · 声
 *
 *  一句话说清这一章的交互：**年代轴是目录，主舞台是展品**。
 *  轴上十个节点，点哪个，主舞台就换上哪一件 —— 图谱、文字、声音一起换。
 *
 *  三件乐器（汉 / 宋 / 明）其实不是乐器，是"史"：那三段没有传世器物可陈列，
 *  所以主舞台摆一个大字。硬塞一件乐器进去凑数，是把史说成了器。
 *
 *  声音一律由 10-audio.js 合成，零音频文件；音阶锁在五声 / 七声里，
 *  评委乱点也不会撞出不协和音程（钟与瑟余韵长、会叠在一起，只用五声；
 *  骨笛与唢呐是单音吹奏，用七声，与"可奏七声音阶"的试吹结论一致）。
 *
 *  调度纪律：整段旋律**一次性**用绝对 ctx.currentTime 排进 Web Audio，
 *  绝不用 setTimeout 一个个触发 —— 那种写法在负载下必然抖。
 * ========================================================================== */
(function () {
  'use strict';
  var H = window.HENAN;
  if (!H) return;

  var built = false, armed = false, cur = -1;
  var elMain, elShow, elFig, elInfo, elAxis, elRing, elHint;
  var swapTok = 0;        // 换展品的令牌：慢一步的旧切换要能被新切换作废
  var seqUntil = 0;       // 上一段旋律排到什么时候，用来防止连点叠成一团

  function data() { return (H.music && H.music.nodes) || []; }
  function nodeAt(i) { return data()[i]; }

  /* ---------- 音色表 ---------- */
  /* 每件乐器一个音色。只换图不换声，"陈列"就退化成图标列表了。
     gap 是走句时两音之间的间隔：钟的余韵以秒计，不拉开就糊成一片；
     dur 是单音时长，吹管短、拨弦长（瑟要留出余韵）。 */
  var VOICE = {
    flute: { gap: 0.42, dur: 0.40, play: function (a, f, t) { a.flute(f, 0.40, t); } },
    xun:   { gap: 0.52, dur: 0.46, play: function (a, f, t) { a.xun(f, 0.46, t); } },
    bell:  { gap: 0.80, dur: 0.80, play: function (a, f, t) { a.bell(f, t, 0.85); } },
    pluck: { gap: 0.40, dur: 2.60, play: function (a, f, t) { a.pluck(f, 2.60, t); } },
    bow:   { gap: 0.56, dur: 0.50, play: function (a, f, t) { a.bow(f, 0.50, t); } },
    reed:  { gap: 0.34, dur: 0.30, play: function (a, f, t) { a.reed(f, 0.30, t); } }
  };
  function voiceOf(node) { return VOICE[node.voice] || VOICE.flute; }

  /* ---------- 建 DOM（首次进本章才建） ---------- */
  function build(stage) {
    if (built) return;

    var root = H.el('div', 'sound');
    root.innerHTML =
      '<header class="sound__head">' +
        '<span class="sound__num t-label">肆</span>' +
        '<h2 class="sound__title t-kai">声</h2>' +
        '<p class="sound__sub">八千年中原乐音 · 自一支鹤骨至一杆唢呐</p>' +
      '</header>' +
      '<div class="sound__main">' +
        '<div class="show">' +
          '<div class="show__fig">' +
            /* 环形水纹画在**最底层**：它是"声在空气里荡开"的背景，
               压在乐器下面才像乐器在发声，压在上面就成了一圈遮住乐器的网。
               由 10-audio.js 的分析节点实时驱动，见本文件末尾的 frameWave。 */
            '<canvas class="show__wave" aria-hidden="true"></canvas>' +
            /* 环在图谱**之后**插入，所以它在最上层 —— 音波要压着乐器荡开才像声 */
            '<div class="show__ring"></div>' +
            '<p class="show__hint t-label"></p>' +
          '</div>' +
          '<div class="show__info"></div>' +
        '</div>' +
        '<nav class="axis" aria-label="年代轴"></nav>' +
      '</div>';

    stage.appendChild(root);
    elMain = H.$('.sound__main', root);
    elShow = H.$('.show', root);
    elFig  = H.$('.show__fig', root);
    elInfo = H.$('.show__info', root);
    elAxis = H.$('.axis', root);
    elRing = H.$('.show__ring', root);
    elHint = H.$('.show__hint', root);

    buildAxis();
    // 动画只在第一次换展品时由排版引擎自行结束，这里挂一次就够
    elFig.addEventListener('animationend', function (e) {
      if (e.animationName === 'sound-ring') elFig.classList.remove('is-ringing');
    });
    built = true;
  }

  function buildAxis() {
    var frag = document.createDocumentFragment();
    data().forEach(function (n, i) {
      var b = H.el('button', 'axis__node');
      b.type = 'button';
      b.dataset.idx = i;
      b.setAttribute('aria-label', n.era + ' · ' + n.name);
      b.innerHTML =
        '<span class="axis__fig' + (n.kind === 'era' ? ' axis__fig--era' : '') + '">' +
          (n.kind === 'era'
            ? n.glyph
            : '<svg viewBox="0 0 120 120" aria-hidden="true"><use href="#ic-' + n.icon + '"/></svg>') +
        '</span>' +
        '<span class="axis__name">' + n.name + '</span>' +
        '<span class="axis__era">' + (n.eraShort || n.era) + '</span>';
      frag.appendChild(b);
    });
    elAxis.appendChild(frag);
  }

  /* ---------- 图谱：乐器用 <use> 取内联图标，另叠一层热区 ---------- */
  var NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
    return n;
  }

  function figureFor(node) {
    if (node.kind === 'era') {
      return H.el('div', 'show__glyph t-kai', node.glyph);
    }
    var svg = svgEl('svg', { class: 'show__svg', viewBox: '0 0 120 120' });
    svg.appendChild(svgEl('use', { href: '#ic-' + node.icon }));
    /* 热区叠在图标上，坐标就是图标自己的 120 坐标系 —— 所以两边的数字必须一致。
       命中圈比看得见的孔大一圈：孔本身半径只有 2 个多单位，
       换算到屏幕上不足 20px，直接拿它当命中区太难点。 */
    (node.holes || []).forEach(function (h) {
      var g = svgEl('g', { class: 'spot', tabindex: '0', role: 'button' });
      g.setAttribute('aria-label', (h.label || '') + ' ' + node.name);
      g.appendChild(svgEl('circle', { class: 'spot__hit',  cx: h.x, cy: h.y, r: 4.2 }));
      g.appendChild(svgEl('circle', { class: 'spot__halo', cx: h.x, cy: h.y, r: 4.0 }));
      g.dataset.step = h.step;
      svg.appendChild(g);
    });
    return svg;
  }

  /* ---------- 换展品 ---------- */
  function swapFigure(node) {
    var tok = ++swapTok;
    elShow.classList.add('is-swapping');
    // 先淡出再换 DOM。150ms 是"看得出换了一件"的下限，
    // 再快就成了硬切，反而显得像闪烁。
    H.wait(150).then(function () {
      if (tok !== swapTok) return;             // 期间又换过，这一次作废
      var old = H.$('.show__svg, .show__glyph', elFig);
      if (old) elFig.removeChild(old);
      elFig.insertBefore(figureFor(node), elRing);
      elHint.textContent = (node.holes && node.holes.length) ? '点孔试音' : '';
      elShow.classList.remove('is-swapping');
    });
  }

  function fillInfo(node) {
    var v = node.kind === 'inst' ? voiceOf(node) : null;
    elInfo.innerHTML =
      '<p class="show__era"><b>' + node.era + '</b><span class="t-label">' + node.year + '</span></p>' +
      '<h3 class="show__name t-kai">' + node.name + '</h3>' +
      '<p class="show__lead">' + (node.lead || '') + '</p>' +
      (node.place ? '<p class="show__place">' + node.place + '</p>' : '') +
      '<p class="show__desc">' + (node.desc || '') + '</p>' +
      '<p class="show__story">' + (node.story || '') + '</p>' +
      (v ? '<div class="show__acts"><button type="button" class="btn show__play">奏一段</button></div>' : '');

    var play = H.$('.show__play', elInfo);
    if (play) {
      play.addEventListener('click', function () { playSeq(node, true); });
    }
  }

  function select(i, opts) {
    var node = nodeAt(i);
    if (!node) return;
    if (i === cur && !(opts && opts.force)) return;
    cur = i;

    Array.prototype.forEach.call(elAxis.children, function (b, j) {
      var on = j === i;
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-current', on ? 'true' : 'false');
    });
    // 选中的那一格滚进视野（轴上放不下时会横向溢出）
    var cell = elAxis.children[i];
    if (cell && cell.scrollIntoView) {
      try { cell.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) { /* 老浏览器忽略 */ }
    }

    swapFigure(node);
    fillInfo(node);
    // 点乐器 = 听一小段，这是这一章的正事；点汉/宋/明三段只换文字
    if (node.kind === 'inst') playSeq(node, false);
    H.emit('sound:select', { id: node.id, index: i });
  }

  /* ---------- 出声 ---------- */
  function ring() {
    if (H.reduceMotion) return;
    elFig.classList.remove('is-ringing');
    void elFig.offsetWidth;                    // 强制重排，动画才会从头再播一次
    elFig.classList.add('is-ringing');
  }

  function strike(step) {
    var node = nodeAt(cur);
    if (!node || node.kind !== 'inst' || !H.audio) return;
    H.audio.unlock();
    var a = H.audio;
    voiceOf(node).play(a, a.noteOf(node.root || 440, step), a.now + 0.02);
    ring();
    /* 敲在乐器上的手感。安卓有效、iOS 静默无效 —— 见 00-core.js 的 H.buzz。
       音孔是"点下去"的动作，这一下震动比任何视觉反馈都直接。 */
    H.buzz(10);
  }

  /* 整段走句：全部音一次性排进绝对时间轴 */
  function playSeq(node, force) {
    var a = H.audio;
    if (!node || node.kind !== 'inst' || !a || !a.ctx) return;
    a.unlock();
    var now = a.ctx.currentTime;
    // 连点年代轴时，上一段还没走完就不要叠上去 —— 十条旋律同时响是一团噪音。
    // 但"奏一段"按钮是明确要重听，force 放行。
    if (!force && now < seqUntil) return;

    var v = voiceOf(node), steps = node.seq || [];
    var t0 = now + 0.06;
    for (var i = 0; i < steps.length; i++) {
      v.play(a, a.noteOf(node.root || 440, steps[i]), t0 + i * v.gap);
    }
    seqUntil = t0 + steps.length * v.gap + v.dur + 0.3;
    ring();
  }

  /* ---------- 事件 ---------- */
  function bindUI(stage) {
    elAxis.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.axis__node') : null;
      if (!b) return;
      select(+b.dataset.idx);
    });

    // 键盘：轴上左右翻，空格/回车选中。焦点在热区上时下方另有处理。
    elAxis.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      select(H.clamp(cur + (e.key === 'ArrowRight' ? 1 : -1), 0, data().length - 1));
    });

    /* 图谱热区：指针划过就出声，这是"吹"的手感 —— 划过去一串音，
       比一个个点更像在乐器上走了一遍。声音本身有 22ms 的排程延迟，
       所以快速划过不会糊，反而连成一句。

       ⚠️ 触屏必须在这里就返回，不能靠下面的 click 兜底。
       手指点一下会依次触发 pointerover → pointerdown → pointerup → click → pointerout，
       也就是说**一次点击会把 strike() 走两遍**，两声相差几毫秒 ——
       听感上是一个明显的"叠音"（同音重击），在骨笛、埙这种起音清晰的音色上格外刺耳。
       原先的注释写着"触屏没有 hover，得靠点"，那是把鼠标的模型套到触屏上了：
       Pointer Events 里 pointerover 对触摸照样发。 */
    elFig.addEventListener('pointerover', function (e) {
      if (e.pointerType === 'touch') return;
      var g = e.target.closest ? e.target.closest('.spot') : null;
      if (!g) return;
      g.classList.add('is-hit');
      strike(+g.dataset.step);
    });
    elFig.addEventListener('pointerout', function (e) {
      var g = e.target.closest ? e.target.closest('.spot') : null;
      if (g) g.classList.remove('is-hit');
    });
    elFig.addEventListener('click', function (e) {
      var g = e.target.closest ? e.target.closest('.spot') : null;
      if (g) strike(+g.dataset.step);     // 触屏没有 hover，得靠点
    });
    elFig.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var g = e.target.closest ? e.target.closest('.spot') : null;
      if (!g) return;
      e.preventDefault();
      strike(+g.dataset.step);
    });
  }

  /* ---------- 音画联动：环形水纹 ---------- */
  /* 取声口在 10-audio.js（H.audio.wave / level），它串在 master 与 destination 之间，
     是直通节点，不动音色。

     ⚠️ 这一层**只在声章激活时跑**。常驻 rAF 在手机上会一直烧电，
        而这一章的画布只在观众停在声章时才需要动。
        起停挂在下面 enter/leave 上 —— 那两个事件本来就有。 */
  var wcv, wctx, wraf = 0, wdpr = 1, wW = 0, wH = 0;

  function sizeWave() {
    if (!wcv) return;
    var r = wcv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    wdpr = Math.min(window.devicePixelRatio || 1, 2);
    wW = r.width; wH = r.height;
    wcv.width = Math.round(wW * wdpr);
    wcv.height = Math.round(wH * wdpr);
    wctx.setTransform(wdpr, 0, 0, wdpr, 0, 0);
  }

  function frameWave() {
    wraf = 0;
    if (!wctx || !wW) return;
    if (document.hidden) { wraf = requestAnimationFrame(frameWave); return; }

    var a = H.audio;
    var buf = a && a.wave ? a.wave() : null;
    var lv = a && a.level ? a.level() : 0;

    /* 往舞台上写 --amp，让 CSS 也能"听见"声音 ——
       纯 CSS 的 .show__ring 用它控制缩放，两套动画就合成了一套，
       不必再各算各的（原来是 CSS 自顾自地循环，与声音毫无关系）。 */
    var stage = H.stageOf('sound');
    if (stage) stage.style.setProperty('--amp', lv.toFixed(3));

    wctx.clearRect(0, 0, wW, wH);

    var cx = wW / 2, cy = wH / 2;
    var base = Math.min(wW, wH) * 0.30;

    /* 静息时也画一圈极淡的底纹：否则没声音的那几秒里，
       乐器周围是空的，看着像"这一章坏了"。 */
    wctx.beginPath();
    wctx.arc(cx, cy, base, 0, Math.PI * 2);
    wctx.strokeStyle = 'rgba(107,100,85,0.13)';
    wctx.lineWidth = 1;
    wctx.stroke();

    if (buf) {
      /* 环形波形：把时域样点当成半径的偏移量，绕一圈画成闭合曲线。
         ⚠️ 每 4 个样点取一个 —— 1024 个点绕一圈在手机上既慢又看不出细节，
            256 个点已经足够顺滑。 */
      var N = 256, step = Math.floor(buf.length / N) || 1;
      wctx.beginPath();
      for (var i = 0; i < N; i++) {
        var d = (buf[i * step] - 128) / 128;          // -1 ~ 1
        var ang = (i / N) * Math.PI * 2 - Math.PI / 2;
        // 振幅最多把半径推出去 55%：再多环就顶到图谱边上了
        var rr = base * (1 + d * 0.55);
        var x = cx + Math.cos(ang) * rr;
        var y = cy + Math.sin(ang) * rr;
        if (i === 0) wctx.moveTo(x, y); else wctx.lineTo(x, y);
      }
      wctx.closePath();
      wctx.strokeStyle = 'rgba(63,107,125,' + (0.22 + lv * 0.5).toFixed(3) + ')';
      wctx.lineWidth = 1.4 + lv * 1.6;
      wctx.stroke();
    }

    wraf = requestAnimationFrame(frameWave);
  }

  function startWave() {
    if (!wcv) {
      wcv = H.$('.show__wave', elFig);
      if (!wcv) return;
      wctx = wcv.getContext('2d');
    }
    sizeWave();
    /* 先**同步**画一帧，再交给 rAF。
       两个理由：一是避免进入这一章的头一帧画布是空的；
       二是无头截图推不动 rAF（虚拟时钟不驱动合成器），
       不同步画这一帧，这个层在截图里永远是空白，等于没法验收。 */
    frameWave();
    if (!wraf) wraf = requestAnimationFrame(frameWave);
  }

  function stopWave() {
    if (wraf) { cancelAnimationFrame(wraf); wraf = 0; }
    var stage = H.stageOf('sound');
    // 归零，否则离开这一章后 .show__ring 会停在被声音撑大的那个尺寸上
    if (stage) stage.style.setProperty('--amp', '0');
    if (wctx) wctx.clearRect(0, 0, wW, wH);
  }

  /* ---------- 章节 ---------- */
  H.chapter('sound', {
    enter: function () {
      var stage = H.stageOf('sound');
      if (!stage) return;
      build(stage);
      if (!armed) { bindUI(stage); armed = true; }
      // 展开动画：下一帧再加类，让 clip-path 有"之前"可以插值
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { stage.classList.add('is-armed'); });
      });
      if (cur < 0) select(0);            // 默认落在骨笛 —— 这一章的起点
      /* 水纹要等 clip-path 展开之后才量得到尺寸（展开前 .show__fig 是裁掉的）。
         一个 rAF 不够，展开是 CSS 过渡，得等它把尺寸定下来。
         所以先量一次（能拿到就有），再补一次 —— 量不到时 sizeWave 会自己返回，
         下一帧的 rAF 循环里也不会崩。 */
      startWave();
      H.wait(420).then(function () { if (H.current() === 'sound') sizeWave(); });
      H.emit('sound:enter');
    },
    leave: function () {
      var stage = H.stageOf('sound');
      if (stage) stage.classList.remove('is-armed');
      seqUntil = 0;                      // 离开后允许再次进入时立刻出声
      stopWave();
      H.emit('sound:leave');
    }
  });

  /* 深链：tools/shot.sh 用 #debug=sound&inst=xun 直接把某件乐器拍出来。
     70-boot.js 发事件而不是直接调本模块 —— 章节之间只通过事件总线耦合。 */
  H.on('sound:play', function (e) {
    if (!e || !e.id) return;
    var list = data();
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === e.id) { select(i, { force: true }); return; }
    }
  });

  /* ⚠️ 不能叫 H.sound 之外的名字冲突源：数据在 HENAN.music，
     接口在 HENAN.sound —— 两者不同名，安全。但仍沿用 40-map/50-scroll
     那条教训，接口一律带 UI 后缀的成员，避免与将来的数据键撞上。 */
  H.sound = {
    playInstrument: function (id) { H.emit('sound:play', { id: id }); },
    select: select,
    count: function () { return data().length; },
    current: function () { return cur; },
    built: function () { return built; }
  };
})();

</script>
<!-- 第二期新增的两卷。编号跟着**章节顺序**走（66 遗 / 67 名）。
     原来的 65-figures.js（肆·人）已于 2026-09-29 整卷删除 ——
     CSS / 数据 / 逻辑三块一并撤掉，不是只从导航里摘掉。 -->
<script data-from="assets/js/66-crafts.js">
/* ============================================================================
 *  66-crafts.js —— 贰 · 遗（非遗）
 *
 *  一个**田字格**：四格木架，一格一样。
 *
 *  ---------- 从十八格改到四格 ----------
 *
 *  这一卷原是一面十八格的博古架（一市一项），2026-09-28 按用户要求收缩为
 *  四项：豫剧、皮影戏、太极拳、唐三彩 —— 唱、影、拳、彩，
 *  豫东、豫南、豫北、豫西各占一方。撤下的十四条整体存进了
 *  assets/data/crafts-archive.js（**不被本页加载**），没有删。
 *
 *  「艺」也改成了「遗」。模块 id 仍叫 crafts —— 改 id 要连着动
 *  H.order / H.meta / #stage-* / 各条 veil 转场的 data-kind / 深链参数，
 *  牵一处漏一处，换来的只是代码里的名字好看；观众看到的那一个「遗」字
 *  在下面 build() 的题头里写着。
 *
 *  ---------- 为什么不是四件器物图标 ----------
 *
 *  原本的打算是给每一项画一件内联 SVG 器物，像「声」卷那七件乐器一样。
 *  真动手时发现这条路走不通：这一卷的项目里有一半**不是器物，是行为**——
 *  跑帷子是舞、四平调是戏。给「戏」画一件东西，画什么都是错的；
 *  画一个抽象的符号，又和旁边写实的器物图标摆在一起，一眼就看出是凑的。
 *
 *  改用格子：**格子本身就是内容**。一格一个大字，是"款识"的摆法，
 *  既贴这一卷的气质，也不冒充具象。四格之后这一点更站得住 ——
 *  每格大到可以放一张照片，字就退成照片角落上的一方款识。
 *
 *  ---------- 一格的构成 ----------
 *
 *  上：图位。有素材（数据里的 img）就是照片，没有就是一枚大字（挂 #inkbleed 做墨洇）。
 *  下：项目名 / 产地 / 一句话。
 *  点开是一张详情：是什么、怎么做、一段史事。
 *
 *  这一卷的份量全在 `place` 上 —— 每一项都精确到镇/村
 *  （周党镇龙镇村、陈家沟村、南石山村）。那不是装饰：
 *  非遗的申报地区往往就是一个村，写"河南"和写"龙镇村"，
 *  差的是对这一卷到底懂不懂。
 * ========================================================================== */
(function () {
  'use strict';
  var H = window.HENAN;
  if (!H) return;

  var built = false, armed = false, cur = -1;
  var elShelf, elPanel, elCrafts;
  var elVid, elVidBox;

  function data() { return (H.crafts || []); }

  /* 手机上打不开控制台，脚本一出错就只表现为"点了没反应"，
     而且往往炸在 build() 里 —— 那一步在章节进入时跑，异常一路冒出去，
     连 bindUI() 都执行不到，格子看得见、点下去却什么都不发生。
     所以把异常摊到页面上，至少能看见是哪一步、什么错。
     正常时它什么都不做，页面上不会多出任何东西。 */
  function reportErr(where, e) {
    try {
      var bar = document.getElementById('__errbar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = '__errbar';
        bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;' +
          'background:#8e2a20;color:#fff;font:12px/1.6 monospace;padding:6px 10px;' +
          'max-height:32vh;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(bar);
      }
      bar.textContent += '非遗 [' + where + '] ' + ((e && e.message) || e) + '\n';
    } catch (x) { /* 上报本身再炸就认了，不能让它把正事带塌 */ }
  }

  /* 兜底：模块里没包到的地方（异步回调、别的章节）出错，也摊到页面上。
     不加 capture —— 加了会把"某张图没加载出来"这类资源错误也一起收进来，
     那属于素材缺失，不是脚本坏了，混在一起反而看不清。
     正常运行时它什么都不显示。 */
  window.addEventListener('error', function (e) {
    reportErr('window', (e && (e.message || (e.error && e.error.message))) || '未知错误');
  });

  /* 每格刻哪个字。这是**呈现**，不是内容，所以放在模块里而不进数据文件 ——
     数据说的是"这项技艺是什么"，这里决定"它长什么样"。
     四项各取一个最有辨识度的字：唱（豫剧）、影（皮影）、拳（太极）、彩（三彩）。
     题头下面那句「唱、影、拳、彩」用的就是这四个字，两处必须一致 ——
     这里改一个字，题头那句也要跟着改（反过来也一样）。 */
  var GLYPH = {
    410200: '唱',   // 豫剧
    411500: '影',   // 皮影戏
    410800: '拳',   // 太极拳
    410300: '彩'    // 唐三彩
  };
  function glyphOf(d) { return GLYPH[d.adcode] || String(d.name || '').slice(0, 1); }

  /* ---------- 建 DOM ---------- */
  function build(stage) {
    if (built) return;
    var list = data();
    if (!list.length) { console.warn('66-crafts: 缺少非遗数据'); return; }

    var root = H.el('div', 'crafts');
    root.innerHTML =
      '<header class="crafts__head">' +
        '<span class="crafts__num t-label">贰</span>' +
        '<h2 class="crafts__title t-kai">遗</h2>' +
        /* 章名只剩一个字「遗」，光看题头认不出这是一章什么 ——
           所以这句副题不能省，它把这四个字与"非遗"接上。 */
        '<p class="crafts__sub t-label">非遗四项 · 唱、影、拳、彩</p>' +
      '</header>' +
      '<div class="crafts__shelf"></div>';

    stage.appendChild(root);
    elShelf = H.$('.crafts__shelf', root);
    elCrafts = root;

    var frag = document.createDocumentFragment();
    list.forEach(function (d, i) {
      var b = H.el('button', 'craft' + (d.img ? ' has-fig' : ''));
      b.type = 'button';
      b.dataset.adcode = d.adcode;
      b.dataset.idx = i;
      /* 这里**不写 role="list" / "listitem"**。原先写了两处，是个实打实的错：
         role 写在 <button> 上会把这个按钮**顶掉**（一个元素只有一个 role），
         读屏念到的是"列表项"，按下去会怎样反而没人告诉它。
         四格一组按钮，本来也不需要列表语义。 */
      b.setAttribute('aria-label', d.city + ' · ' + d.name + '，' + d.place);
      b.innerHTML =
        '<span class="craft__fig">' +
          (d.img ? '<img class="craft__img" alt="" decoding="async" src="' + d.img + '">' : '') +
          '<span class="craft__glyph t-kai" aria-hidden="true">' + glyphOf(d) + '</span>' +
        '</span>' +
        '<span class="craft__body">' +
          '<span class="craft__name t-kai">' + d.name + '</span>' +
          '<span class="craft__place t-label">' + d.place + '</span>' +
          '<span class="craft__lead t-kai">' + (d.lead || '') + '</span>' +
        '</span>';
      /* 图挂了就退回"只剩大字"的样子。素材是后补的，路径写错或文件没到位时，
         宁可回到这一格本来该有的模样，也不要留一个破图图标在那儿。 */
      var im = b.querySelector('.craft__img');
      if (im) {
        im.addEventListener('error', function () {
          b.classList.remove('has-fig');
          if (im.parentNode) im.parentNode.removeChild(im);
        });
      }
      frag.appendChild(b);
    });
    elShelf.appendChild(frag);

    /* ⚠️ 这两步必须各自包一层 try/catch，不能让异常冒出去。
       它们做的是"详情纸"和"动态图"两个**附加**功能 ——
       万一哪一步在某个浏览器上炸了（比如 <video> 建不出来），
       异常会一路冒到 enter()，把后面的 bindUI() 一起带走：
       格子已经 append 上去了、看得见，但点下去没有任何反应。
       手机上又没控制台，这个症状几乎没法查。 */
    try { buildPanel(stage); } catch (e) { reportErr('buildPanel', e); }
    try { buildVideo(stage); } catch (e) { reportErr('buildVideo', e); }
    built = true;
  }

  /* ---------- 详情：底部升起的一张纸 ---------- */
  function buildPanel(stage) {
    elPanel = H.el('div', 'craftsheet');
    elPanel.setAttribute('role', 'dialog');
    elPanel.setAttribute('aria-modal', 'true');
    elPanel.innerHTML =
      '<button class="craftsheet__close" type="button" aria-label="收起">×</button>' +
      '<div class="craftsheet__inner">' +
        '<div class="craftsheet__top">' +
          '<span class="craftsheet__glyph t-kai" aria-hidden="true"></span>' +
          '<div class="craftsheet__lead">' +
            '<p class="craftsheet__meta t-label"></p>' +
            '<h3 class="craftsheet__name t-kai"></h3>' +
            '<p class="craftsheet__lv"></p>' +
          '</div>' +
        '</div>' +
        /* 这里原有 <hr class="rule rule--dot">（一条两端渐隐的墨线 + 小菱形）。
           全站装饰墨线取消时去掉，题头与正文之间改由 .craftsheet__leadline
           自己的 margin 分隔。 */
        '<p class="craftsheet__leadline t-kai"></p>' +
        '<p class="craftsheet__desc"></p>' +
        '<p class="craftsheet__story"></p>' +
        '<p class="craftsheet__note t-label"></p>' +
      '</div>';
    stage.appendChild(elPanel);

    H.$('.craftsheet__close', elPanel).addEventListener('click', close);
    // 点纸以外的空白处收起。捕获阶段，免得被内层拦掉
    stage.addEventListener('pointerdown', function (e) {
      if (cur < 0) return;
      if (elPanel.contains(e.target)) return;
      if (e.target.closest && e.target.closest('.craft')) return;
      close();
    }, true);
  }

  /* ---------- 动态图：屏幕中上方的那一段影像 ---------- */
  /* 2026-09-28 用户后补：太极拳、皮影戏各有一段影像，点开对应的一项时
     摆在**屏幕中上方**，详情纸的上头，且不许压住纸上的字。
     做法与理由见 crafts.css「动态图」那一段，这里只说两件事：

     · 为什么是**一个单例**、不放进 open() 里现建现拆：
       它是 fixed 的浮层，与 .craftsheet 同级挂在 stage 上；
       建一次、换 src、亮灭，比每次重建 DOM 少一次布局抖动，
       也免得"关得比开慢"的时候留下两段同时在播的片子。

     · 为什么静音循环、没有控件：
       这一卷要的是"这一样还活着"的一个动，不是让人坐下来看片。
       所以它是一张**动态图** —— 和格子里那张静态的图位是同一个位置上的东西，
       只是这一张会动。 */
  function buildVideo(stage) {
    elVid = H.el('div', 'craftvid');
    /* 纯装饰：这一项在讲什么，详情纸上一字不少。
       读屏念到"视频"反而会打断那一整段正文。 */
    elVid.setAttribute('aria-hidden', 'true');
    elVid.innerHTML =
      '<span class="craftvid__frame">' +
        /* playsinline：iOS 上不加这个，一播就劫持成全屏播放器。
           disablepictureinpicture / disableremoteplayback：同上，
           它是一张图，不该有"投屏""画中画"这类出口。 */
        '<video class="craftvid__video" muted loop playsinline preload="auto" ' +
          'disablepictureinpicture disableremoteplayback></video>' +
      '</span>';
    stage.appendChild(elVid);
    elVidBox = H.$('.craftvid__video', elVid);
    /* 两路 src 互备靠这两个事件：元数据到了就撤掉回退计时器；
       报错了就先回退、回退不了才上报（见 onVidMeta / onVidErr）。 */
    elVidBox.addEventListener('loadedmetadata', onVidMeta);
    elVidBox.addEventListener('error', onVidErr);
  }

  function playVideo() {
    if (!elVidBox) return;
    var p = elVidBox.play();
    /* iOS 低电量模式之类会拒绝自动播放。拒绝不是故障：
       本来就当"动态图"用，退成一张静帧也是完整的，不该弹任何东西出来打扰。
       只在**下一次**碰屏幕时悄悄补一次播放 —— 挂一次就摘，不留常驻监听。 */
    if (p && p.catch) {
      p.catch(function () {
        var retry = function () {
          document.removeEventListener('pointerdown', retry);
          document.removeEventListener('keydown', retry);
          if (cur < 0 || !elVid || !elVid.classList.contains('is-on')) return;
          var q = elVidBox.play();
          if (q && q.catch) q.catch(function () { /* 还是不行就让它停在静帧上 */ });
        };
        document.addEventListener('pointerdown', retry);
        document.addEventListener('keydown', retry);
      });
    }
  }

  function hideVideo() {
    if (!elVid) return;
    /* 收起就把回退计时器撤掉。不撤的话，它会在一秒多之后醒过来，
       发现 readyState 是 0（已经 pause 了），再误报一条红字出来。 */
    clearSrcTimer();
    elVid.classList.remove('is-on');
    elPanel.classList.remove('has-video');
    document.documentElement.classList.remove('is-video');
    /* 收起就暂停。不停的话，观众翻到别的章去了，这段片子还在后台空转 ——
       手机上是实打实的电。 */
    if (elVidBox) { try { elVidBox.pause(); } catch (e) { /* 无所谓 */ } }
  }

  /* ---------- 大 data URI 在手机上的坑（这一段是补的，别删） ----------
     症状：桌面 Chrome 一切正常，手机上点开**某几项**影像一片空白 ——
     load() 不报错、error 事件也不来、控制台干干净净，只是画面一直不出现。
     成因：src 写的是 `data:video/mp4;base64,...` 这种超长 URL，
     整串要交给媒体栈去解析。Android 那条路上有长度上限，超过就**静默失败**。
     本项目四段实测的界线（data URI 字符数）：
       皮影戏   69.7 万  → 正常
       唐三彩  107.5 万  → 正常
       太极拳  268.8 万  → 不显示
       豫剧    355.8 万  → 不显示
     桌面 Chrome 没有这条线，所以本地跑校验永远全绿 —— 这正是它难查的地方。
     办法：base64 仍然留在文件里（单文件、file:// 直开都不变），
     但**在点开的那一刻**把它解成二进制、包成 Blob，用 createObjectURL 当 src，
     交给媒体栈的就只剩一个几十字节的 blob: 地址。
     ⚠️ 是"点开才解"，不是页面一载入就解四段 —— 四段一起解要多占十几兆内存，
        而绝大多数访客一次只看一格。解过的存起来，反复点不重复解。 */
  var blobCache = {};
  function blobKey(s) { return s.length + '|' + s.slice(0, 48); }
  function toBlobURL(dataUri) {
    /* 不是 data URI（将来换回普通相对路径）就原样返回，这条路不做任何假设 */
    if (!dataUri || dataUri.slice(0, 5) !== 'data:') return dataUri;
    var k = blobKey(dataUri);
    if (blobCache[k]) return blobCache[k];
    try {
      if (!window.Blob || !window.URL || !URL.createObjectURL || !window.atob) return dataUri;
      var comma = dataUri.indexOf(',');
      if (comma < 0) return dataUri;
      var head = dataUri.slice(5, comma);
      if (head.indexOf('base64') < 0) return dataUri;
      var mime = head.split(';')[0] || 'video/mp4';
      var bin = window.atob(dataUri.slice(comma + 1));
      var n = bin.length, buf = new Uint8Array(n);
      for (var i = 0; i < n; i++) buf[i] = bin.charCodeAt(i);
      var u = URL.createObjectURL(new Blob([buf], { type: mime }));
      blobCache[k] = u;
      return u;
    } catch (e) {
      /* 解不出来（内存不够 / atob 被限）就退回 data URI ——
         桌面本来就能用，手机上也只是回到改之前的样子，不会更糟。 */
      reportErr('toBlobURL', e);
      return dataUri;
    }
  }

  /* 换片时用的是哪两路 src（blob 与 data URI），以及"没出画面"的计时器。
     两路互备：blob 那一路万一在某些环境下取不到（老 WebView 从 file:// 或
     content:// 打开），就自动退回 data URI 再试一次 —— 总有一路能出画面。
     只有**两路都没出画面**才报错，报出来的是真正需要人介入的情况。 */
  var curDataSrc = '', curBlobSrc = '', srcTimer = 0;

  function clearSrcTimer() {
    if (srcTimer) { clearTimeout(srcTimer); srcTimer = 0; }
  }

  /* blob 那一路没走通 → 退回 data URI 再试一次 */
  function fallbackToData() {
    if (!curBlobSrc || !curDataSrc || !elVidBox) return false;
    if (elVidBox.getAttribute('src') !== curBlobSrc) return false;
    elVidBox.setAttribute('src', curDataSrc);
    elVidBox.muted = true;
    elVidBox.load();
    playVideo();
    return true;
  }

  /* 元数据到了：这一路是通的，把回退计时器撤掉。 */
  function onVidMeta() { clearSrcTimer(); }

  /* 明确的错误事件：先试回退，回退也没得退了才上报。 */
  function onVidErr() {
    clearSrcTimer();
    if (fallbackToData()) return;
    reportErr('video', '两路 src 都没出画面（error code=' +
      (elVidBox && elVidBox.error ? elVidBox.error.code : '?') + '）');
  }

  /* 换片。d.video 为空就退回"只有文字"的老样子，与从前完全一样，
     不留一个空框在那儿。
     ⚠️ 现在四格**都有**片子，这条分支走不到了 —— 但留着它：
        它是"某一样没有影像"这件事的唯一出口，删掉的话将来加回一项
        没有影像的，点开就会露出一个空框。验证脚本里用一个临时把
        video 置空的用例专门压这条路径。
     key 是抠像用哪一支亮度键（'figure' | 'screen'），两支的阈值宽窄不同，
     共用一支必然顾此失彼 —— 见 svg-defs 里那两支滤镜的注释。
     （'figure' 现在是太极拳、豫剧、唐三彩三段共用；
       它们为什么能共用，见 crafts.js 里各项上面的注释。） */
  function setVideo(src, key) {
    /* 影像框没建出来（buildVideo 失败过）时原本是静默 return，
       结果是"纸开了、没影像"，看起来像这一项本来就没片子，根本查不出来。
       报一次，让人知道问题出在建框那一步。 */
    if (!elVid || !elVidBox) {
      if (src) reportErr('setVideo', '影像框没建出来（buildVideo 失败过）');
      return;
    }
    if (!src) { hideVideo(); return; }

    /* ⚠️ 这一行要放在下面那个 if **外面**。
       连点两次同一项时 src 没变、里面整块都会跳过，
       但那时滤镜仍然得是对的 —— 放在里面就会残留上一次那一支。 */
    /* 用 add/remove 而不是 classList.toggle(name, force)：
       带第二参数的 toggle 是 DOM4 才定的，个别国产内核 / 老 WebView 上会直接抛
       TypeError —— 而它抛在 setVideo 里，会把整个 open() 带塌，
       症状正好是"点了完全没反应"。这一处不值得冒那个险。 */
    if (key === 'screen') elVidBox.classList.add('is-screen');
    else elVidBox.classList.remove('is-screen');

    /* 超长 data URI 在手机上会被媒体栈静默丢掉（见上面 toBlobURL 那一段），
       所以正常走的是 blob: 那一版；data URI 留着当备胎。 */
    var blobSrc = toBlobURL(src);
    curDataSrc = src;
    curBlobSrc = (blobSrc !== src) ? blobSrc : '';
    /* 留一枚指纹：blob: 地址区分不出是哪一段，data URI 的长度能。
       校验脚本靠它判断"换项真的换了片源"，比比 src 字符串可靠。 */
    elVidBox.setAttribute('data-vlen', String(src.length));

    if (elVidBox.getAttribute('src') !== blobSrc) {
      elVidBox.setAttribute('src', blobSrc);
      /* innerHTML 上那个 muted 属性个别浏览器不认，IDL 上再点一次名。
         ⚠️ 必须在 load() 之前 —— 自动播放的判据是"有没有声音"，
            晚一步设就正好赶上被拦。 */
      elVidBox.muted = true;
      elVidBox.load();

      /* 兜底计时：正常几毫秒就该到 loadedmetadata。等 4.5 秒还没到
         （readyState 仍是 0），就当这一路在静默失败 —— 这正是手机上
         超长 data URI 的表现 —— 换另一路再试。
         ⚠️ 门限给得宽（4.5s）是故意的：blob 是本地的，元数据要真超过 4.5 秒，
            那台设备本来也放不动；而门限太紧会误判，把**本来能播**的一路
            换成另一路，反而把好端端的画面弄没了。 */
      clearSrcTimer();
      srcTimer = setTimeout(function () {
        srcTimer = 0;
        if (cur < 0 || !elVid || !elVid.classList.contains('is-on')) return;
        if (!elVidBox) return;

        /* 一、元数据根本没来 —— 这一路静默失败，换另一路 */
        if (elVidBox.readyState < 1) {
          if (fallbackToData()) return;
          reportErr('video', '元数据一直没来（readyState=0，两路都试过）');
          return;
        }
        /* 二、元数据来了、但解不出画面尺寸 —— 解码那条路的问题 */
        if (!elVidBox.videoWidth || !elVidBox.videoHeight) {
          reportErr('video', '元数据到了但 videoWidth=0（没解出画面）');
          return;
        }
        /* 三、片子是好的、量出来却是 0 —— 布局/显示那条路的问题。
           这三种的修法完全不同，所以分开报，别混成一句"没显示"。 */
        var r = elVidBox.getBoundingClientRect();
        if (r.width < 2 || r.height < 2) {
          reportErr('video', '视频框量出来是 0（' + Math.round(r.width) + 'x' + Math.round(r.height) + '）');
        }
      }, 4500);
    }
    elVid.classList.add('is-on');
    elPanel.classList.add('has-video');
    document.documentElement.classList.add('is-video');
    playVideo();
  }

  function open(i) {
    var d = data()[i];
    if (!d) return;
    cur = i;

    /* ⚠️ 详情纸还没建出来就直接退，别在下面按 null 取 textContent ——
       那会抛 TypeError，而且是在 open() 里抛的，
       症状和"压根没绑事件"一模一样：点了没反应，还查不出来。 */
    if (!elPanel) { reportErr('open', '详情纸没建出来（buildPanel 失败过）'); return; }

    /* 填内容整段兜住：填字失败不该连累"把纸升起来"这一步。
       纸上少一段字是遗憾，纸干脆不出现才是坏的。 */
    try {
      H.$('.craftsheet__glyph', elPanel).textContent = glyphOf(d);
      /* place 里已经带了市名的不再重复。豫剧不是一个村子的事，
         place 写的就是「开封一带（祥符调发源地）」，前面再补一个「开封 ·」
         会变成「开封 · 开封一带（祥符调发源地）」。 */
      H.$('.craftsheet__meta', elPanel).textContent =
        (d.place && d.city && d.place.indexOf(d.city) === 0)
          ? d.place
          : d.city + ' · ' + d.place;
      H.$('.craftsheet__name', elPanel).textContent = d.name;
      /* 名录级别与批次拼起来。批次可能是空的（查不到就写空串），
         空的时候不要留一个孤零零的分隔点。 */
      H.$('.craftsheet__lv', elPanel).textContent =
        d.level + (d.batch ? ' · ' + d.batch : '') + (d.era ? ' · ' + d.era : '');
      H.$('.craftsheet__leadline', elPanel).textContent = d.lead || '';
      H.$('.craftsheet__desc', elPanel).textContent = d.desc || '';
      H.$('.craftsheet__story', elPanel).textContent = d.story || '';
      H.$('.craftsheet__note', elPanel).textContent = d.note || '';

      Array.prototype.forEach.call(elShelf.children, function (b, j) {
        var on = j === i;
        b.classList.toggle('is-on', on);
        b.setAttribute('aria-current', on ? 'true' : 'false');
      });
    } catch (e) { reportErr('open.fill', e); }

    /* 有影像的先摆影像。放在开纸之前 —— 两件事都是"从屏幕外进来"，
       影像先一步到位，纸升上来时它已经在上面等着了，不会互相追着动。
       单独兜住：影像失败不该连累纸上的字。 */
    try { setVideo(d.video || '', d.vkey); } catch (e) { reportErr('setVideo', e); }

    elPanel.classList.add('is-on');
    H.$('.craftsheet__close', elPanel).focus();
    if (H.audio) H.audio.blip(1046, 0.4);
    H.buzz(9);
    H.emit('crafts:open', { adcode: d.adcode, id: d.icon });
  }

  function close() {
    if (cur < 0) return;
    var back = elShelf.children[cur];
    cur = -1;
    hideVideo();
    elPanel.classList.remove('is-on');
    Array.prototype.forEach.call(elShelf.children, function (b) {
      b.classList.remove('is-on');
      b.setAttribute('aria-current', 'false');
    });
    // 焦点还给刚才那一格 —— 与味章膳单、图片来源页同一套做法
    if (back && back.focus) {
      try { back.focus({ preventScroll: true }); } catch (e) { /* 老浏览器忽略 */ }
    }
    H.emit('crafts:close');
  }

  /* ---------- 事件 ---------- */
  function bindUI(stage) {
    /* ⚠️ click 之外再挂一次 touchend。
       个别移动端浏览器（尤其 App 内置的 WebView）只要手指落点有几像素位移，
       就把这一下判成"滚动"、不发 click —— 于是格子点了完全没反应。
       两条都挂，用时间戳去重：touchend 先到，就把紧随其后的 click 让掉，
       否则一次触摸会 open() 两遍（详情纸闪一下、视频白白重载一次）。 */
    var touchAt = 0;
    function pick(e) {
      var b = e.target && e.target.closest ? e.target.closest('.craft') : null;
      if (!b) return;
      open(+b.dataset.idx);
    }
    elShelf.addEventListener('touchend', function (e) {
      touchAt = Date.now();
      pick(e);
    }, { passive: true });
    elShelf.addEventListener('click', function (e) {
      if (Date.now() - touchAt < 700) return;   // 这一下已经由 touchend 处理过了
      pick(e);
    });
    // 网格本身可聚焦，方向键在格与格之间走
    elShelf.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var b = e.target.closest && e.target.closest('.craft');
      if (!b) return;
      e.preventDefault();
      open(+b.dataset.idx);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && cur >= 0) { e.stopPropagation(); close(); }
    });
  }

  /* ---------- 章节 ---------- */
  H.chapter('crafts', {
    enter: function () {
      var stage = H.stageOf('crafts');
      if (!stage) return;
      build(stage);
      /* armed 先置上再绑：万一只绑了一半，也不该每次进来都重绑一遍 ——
         重绑会让一次点击触发两次 open()。 */
      if (!armed) { armed = true; try { bindUI(stage); } catch (e) { reportErr('bindUI', e); } }
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { stage.classList.add('is-armed'); });
      });
      H.emit('crafts:enter');
    },
    leave: function () {
      close();
      var stage = H.stageOf('crafts');
      if (stage) stage.classList.remove('is-armed');
      H.emit('crafts:leave');
    }
  });

  /* 深链：#debug=crafts&craft=411000 由 70-boot.js 发事件进来。
     章节之间只通过事件总线耦合，谁也不拿别人的内部对象。 */
  H.on('crafts:open-item', function (e) {
    var stage = H.stageOf('crafts');
    if (!stage || !e || !e.adcode) return;
    build(stage);
    var list = data();
    for (var i = 0; i < list.length; i++) {
      if (list[i].adcode === +e.adcode) { open(i); return; }
    }
  });

  /* ⚠️ 不叫 H.crafts —— HENAN.crafts 是数据，同名会把它顶掉，
     症状是"静默地什么都不画"。沿用 40-map/50-scroll 那条教训，接口带 UI 后缀。 */
  H.craftsUI = {
    built: function () { return built; },
    open: open,
    close: close,
    count: function () { return data().length; }
  };
})();

</script>
<script data-from="assets/js/67-name.js">
/* ============================================================================
 *  67-name.js —— 伍 · 题名（题字盖印）
 *
 *  全篇的最后一卷，也是唯一一卷**由观众自己生成内容**的：
 *  写下名字 → 当场刻一方印 → 盖在卷尾的题名录上，一枚枚攒起来。
 *
 *  ---------- 为什么是"刻"而不是"打" ----------
 *
 *  系统里**没有篆书字体**（Windows 与 macOS 的预装字体栈里都没有），
 *  所以不可能真打出篆体。退而求其次用楷体直接渲染，得到的会是一个
 *  "红方块上写着微软雅黑"——那是网页，不是印章。
 *
 *  所以整个模块的重心不在文字，而在**那圈边框**：
 *     · 边框是一条**顶点带抖动的路径**，不是矩形 —— 手工刻的石头没有直边
 *     · 边缘用随机柔斑侵蚀，做出石边磕碰与印泥不匀
 *     · 字用 destination-out **挖掉**（朱文/阳文），而不是画上去
 *     · 最后叠一层全站那颗 grain 贴图，与 .seal 组件同一手法
 *  这四件事里，第一条是"像印章"与"像红方块"的分界线。
 *
 *  ---------- 关于 canvas.toDataURL 在 file:// 下是否安全 ----------
 *
 *  ⚠️ 这块画布**只画文字与矢量图形，自始至终没有 drawImage 过任何本地图片**。
 *     file:// 下的 canvas 污染只在把**本地图片**画进去之后才发生，
 *     一旦发生，toDataURL() 会抛 SecurityError。
 *     这里是安全的 —— 但这条约束很脆：**将来任何人往这块画布上贴一张照片，
 *     它就会在最要命的时刻（观众点"盖印"）炸掉**。所以写在这里。
 *
 *  ---------- 为什么只存名字、不存图 ----------
 *
 *  一枚印的 PNG 约 10~20KB，localStorage 只有 5MB，几十个人就满了；
 *  而且 file:// 下各家浏览器对 localStorage 的处置并不一致。
 *  改成**只存名字**、印由名字做种子重新生成 —— 存储量小两个数量级，
 *  同一个名字每次盖出来还是同一方印（种子相同），比存图更对。
 * ========================================================================== */
(function () {
  'use strict';
  var H = window.HENAN;
  if (!H) return;

  var KEY = 'jinxiu.timinglu';   // 题名录
  var MAX_ROLL = 60;             // 最多记 60 人，再多屏幕上也挤不下
  var MAX_CHARS = 4;

  var built = false, armed = false;
  var roll = [];                 // [{ n: 名字 }]
  var persisted = true;          // localStorage 能不能用（不能就如实说"仅本次展卷"）
  var elInput, elPreview, elRoll, elStampBtn, elTip, elNote;

  /* 刻过的印缓存起来。不缓存的话，每盖一枚就要把**整卷**重刻一遍 ——
     60 枚就是 60 次 canvas 渲染 + 60 次 toDataURL，几百毫秒，
     而盖印这个动作恰恰要求"立刻落下来"。
     同一个名字永远刻出同一方印（种子固定），所以缓存永远不会失效。 */
  var carveCache = Object.create(null);

  /* ---------- 种子随机 ---------- */
  /* 同一个名字必须每次刻出同一方印（理由见文件头）。
     用 30-gate.js 里同一个 mulberry —— 全站需要"每次一样"的地方都用它。 */
  function seedOf(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function rngFor(seed) {
    var s = seed | 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- 字在印面上的位置 ---------- */
  /* ⚠️ 印章的读序是**从右往左、从上往下**，不是从左往右。
     四字印的顺序是：右上 → 右下 → 左上 → 左下。
     按从左往右排出来的是"名字刻倒了"，懂的人一眼就看得出 ——
     而这一卷的全部意义就是那方印，这是最不能错的一处。
     返回的 c/r 是**列号与行号**，0.5 表示该行居中（三字印的左列只有一字时要居中）。 */
  function slotOf(k, n, cols) {
    if (cols === 1) return { c: 0, r: k };          // 一、二字：单列竖排
    if (n === 3) {
      if (k === 0) return { c: 1, r: 0 };           // 右列上
      if (k === 1) return { c: 1, r: 1 };           // 右列下
      return { c: 0, r: 0.5 };                      // 左列一字，垂直居中
    }
    return { c: k < 2 ? 1 : 0, r: k % 2 };          // 四字：右上下 → 左上下
  }

  /* ---------- 刻一方印 ---------- */
  /* 返回 dataURL。text 最多 4 字；同一个 text 永远刻出同一方印。 */
  function carve(text, px) {
    if (carveCache[text]) return carveCache[text];
    var S = px || 256;
    var dpr = 2;                       // 印章小，2 倍够清晰；给 3 倍只是白费内存
    var cv = document.createElement('canvas');
    cv.width = cv.height = S * dpr;
    var c = cv.getContext('2d');
    c.scale(dpr, dpr);

    var rnd = rngFor(seedOf(text));
    var pad = S * 0.055;
    var x = pad, y = pad, w = S - pad * 2, h = S - pad * 2;

    /* ① 印面：顶点带抖动的路径，不是矩形。
       振幅取边长的 1.6% —— 再小看不出手刻，再大就像撕纸了。 */
    var amp = w * 0.016;
    var PER = 6;                       // 每边 6 段
    var pts = [];
    function edge(x0, y0, x1, y1, horiz) {
      for (var i = 0; i < PER; i++) {
        var t = i / PER;
        var jx = horiz ? 0 : (rnd() - 0.5) * 2 * amp;
        var jy = horiz ? (rnd() - 0.5) * 2 * amp : 0;
        pts.push([x0 + (x1 - x0) * t + jx, y0 + (y1 - y0) * t + jy]);
      }
    }
    edge(x, y, x + w, y, true);
    edge(x + w, y, x + w, y + h, false);
    edge(x + w, y + h, x, y + h, true);
    edge(x, y + h, x, y, false);

    c.beginPath();
    for (var i = 0; i < pts.length; i++) {
      if (i === 0) c.moveTo(pts[i][0], pts[i][1]); else c.lineTo(pts[i][0], pts[i][1]);
    }
    c.closePath();
    c.fillStyle = '#a83128';           // 与全站 --cinnabar 同一个值：印就是印，不该另起一色
    c.fill();

    /* ② 挖字。朱文（阳文）：字是白（纸色）的，靠 destination-out 从印面上抠掉。
       用"抠"而不是"画"是因为这样字与印面之间不会有一圈描边的接缝。 */
    var chars = String(text).slice(0, MAX_CHARS).split('');
    var n = chars.length;
    var cols = n >= 3 ? 2 : 1;
    var rows = Math.ceil(n / cols);
    var colW = w / cols, rowH = h / rows;
    var fs = Math.min(colW, rowH) * 0.72;

    var kai = 'KaiTi, STKaiti, 楷体, serif';
    try {
      var v = getComputedStyle(document.documentElement).getPropertyValue('--f-kai');
      if (v && v.trim()) kai = v.trim();
    } catch (e) { /* 取不到就用上面那串兜底，不影响出图 */ }
    c.font = '600 ' + fs.toFixed(1) + 'px ' + kai;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.globalCompositeOperation = 'destination-out';

    for (var k = 0; k < n; k++) {
      var slot = slotOf(k, n, cols);
      c.fillText(chars[k], x + colW * (slot.c + 0.5), y + rowH * (slot.r + 0.5));
    }
    c.globalCompositeOperation = 'source-over';

    /* ③ 侵蚀：沿边缘随机挖掉一些柔斑，做出石边磕碰与印泥不匀。
       只挖边、不挖心 —— 印面的中心必须是实的，否则字会缺笔画，
       那就不是"旧"而是"坏"了。 */
    var sp = document.createElement('canvas');
    sp.width = sp.height = 32;
    var sc = sp.getContext('2d');
    var g = sc.createRadialGradient(16, 16, 0, 16, 16, 16);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    sc.fillStyle = g;
    sc.fillRect(0, 0, 32, 32);

    c.globalCompositeOperation = 'destination-out';
    for (var e = 0; e < 26; e++) {
      var side = (rnd() * 4) | 0;
      var t2 = rnd();
      var ex, ey;
      if (side === 0)      { ex = x + w * t2; ey = y + (rnd() - 0.5) * amp * 3; }
      else if (side === 1) { ex = x + w + (rnd() - 0.5) * amp * 3; ey = y + h * t2; }
      else if (side === 2) { ex = x + w * t2; ey = y + h + (rnd() - 0.5) * amp * 3; }
      else                 { ex = x + (rnd() - 0.5) * amp * 3; ey = y + h * t2; }
      var rr = S * (0.02 + rnd() * 0.055);
      c.globalAlpha = 0.25 + rnd() * 0.55;
      c.drawImage(sp, ex - rr, ey - rr, rr * 2, rr * 2);
    }
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';

    /* ④ 全站那颗 grain，用 overlay 叠上去 ——
       与 .seal 组件（base.css）完全同一手法，纸上的印才有同一层质感。 */
    try {
      var gimg = new Image();
      // 这一步是**异步**的，但同目录、浏览器已缓存的贴图通常下一帧就到；
      // 没到也不影响出图（只是少了颗粒），所以不做等待、不阻塞。
      gimg.onload = function () {
        c.globalCompositeOperation = 'overlay';
        c.globalAlpha = 0.5;
        c.drawImage(gimg, 0, 0, S, S);
        c.globalAlpha = 1;
        c.globalCompositeOperation = 'source-over';
      };
      gimg.src = __IMG('assets/img/common/grain.png');
    } catch (e) { /* 贴图取不到就算了，印本身是完整的 */ }

    var url = cv.toDataURL('image/png');
    carveCache[text] = url;
    return url;
  }

  /* ---------- 题名录的存取 ---------- */
  /* ⚠️ file:// 下 localStorage 各家浏览器行为不一（有的按文件隔离、有的直接抛），
     所以一律 try 包住。存不了就**如实说**是"本次展卷期间"——
     不能假装存上了，那比存不上更糟。 */
  function loadRoll() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return [];
      var a = JSON.parse(raw);
      return Array.isArray(a) ? a.filter(function (x) { return x && x.n; }).slice(-MAX_ROLL) : [];
    } catch (e) {
      persisted = false;
      return [];
    }
  }
  function saveRoll() {
    try {
      window.localStorage.setItem(KEY, JSON.stringify(roll.slice(-MAX_ROLL)));
      persisted = true;
    } catch (e) {
      persisted = false;      // 配额满、隐私模式、file:// 不支持……一律退化成"仅本次"
    }
  }

  /* ---------- 建 DOM ---------- */
  function build(stage) {
    if (built) return;
    roll = loadRoll();

    var root = H.el('div', 'name');
    root.innerHTML =
      '<header class="name__head">' +
        '<span class="name__num t-label">伍</span>' +
        '<h2 class="name__title t-kai">题名</h2>' +
        '<p class="name__sub t-label">留一方印 · 与十八城同卷</p>' +
      '</header>' +
      '<div class="name__body">' +
        '<div class="name__rollwrap">' +
          '<p class="name__rolltitle t-kai">题名录</p>' +
          /* 原有 <hr class="rule rule--dot">，随全站装饰墨线一并取消。
             "题名录"下面那点间隔现在由 .name__roll 的 margin-top 给。 */
          '<div class="name__roll" id="nameRoll"></div>' +
          '<p class="name__rollnote t-label" id="nameNote"></p>' +
        '</div>' +
        '<div class="name__form">' +
          '<p class="name__hint t-label">写下名号，刻一方印</p>' +
          '<div class="name__field">' +
            '<input class="name__input t-kai" id="nameInput" type="text" ' +
                   'maxlength="' + MAX_CHARS + '" autocomplete="off" spellcheck="false" ' +
                   'inputmode="text" placeholder="名号" aria-label="题名，至多四字">' +
            '<span class="name__preview" id="namePreview" aria-hidden="true"></span>' +
          '</div>' +
          '<button class="btn name__stamp" id="nameStamp" type="button">盖 印</button>' +
          '<p class="name__tip t-label" id="nameTip"></p>' +
        '</div>' +
      '</div>';

    stage.appendChild(root);
    elInput = H.$('#nameInput', root);
    elPreview = H.$('#namePreview', root);
    elRoll = H.$('#nameRoll', root);
    elStampBtn = H.$('#nameStamp', root);
    elTip = H.$('#nameTip', root);
    elNote = H.$('#nameNote', root);

    renderRoll();
    updatePreview();
    built = true;
  }

  /* ---------- 预览 ---------- */
  function updatePreview() {
    var v = (elInput.value || '').trim();
    if (!v) {
      elPreview.style.backgroundImage = 'none';
      elPreview.classList.remove('is-on');
      elStampBtn.disabled = true;
      return;
    }
    elPreview.style.backgroundImage = 'url("' + carve(v) + '")';
    elPreview.classList.add('is-on');
    elStampBtn.disabled = false;
  }

  /* ---------- 题名录 ---------- */
  function renderRoll() {
    elRoll.innerHTML = '';
    if (!roll.length) {
      elRoll.appendChild(H.el('p', 'name__empty t-kai', '卷上尚无名姓'));
    } else {
      roll.forEach(function (item, i) {
        var d = document.createElement('span');
        d.className = 'name__mark';
        d.style.backgroundImage = 'url("' + carve(item.n) + '")';
        /* 位置微偏、浓淡不一 —— 真被人一枚枚盖上去的题名卷，
           不可能每方印都端端正正、深浅一致。角度用序号推出来，
           同一个名字每次进来落在同一处（不用 Math.random，否则每次刷新都在跳）。 */
        var r = rngFor(seedOf(item.n + '#' + i));
        d.style.setProperty('--rot', ((r() - 0.5) * 9).toFixed(2) + 'deg');
        d.style.setProperty('--dy', ((r() - 0.5) * 9).toFixed(1) + 'px');
        d.style.opacity = (0.78 + r() * 0.22).toFixed(2);
        d.title = item.n;
        elRoll.appendChild(d);
      });
    }
    var n = roll.length;
    elNote.textContent = persisted
      ? (n ? '共 ' + n + ' 人题名 · 已留在本机' : '')
      : (n ? '共 ' + n + ' 人题名 · 本次展卷期间' : '本次展卷期间');
  }

  /* ---------- 盖印 ---------- */
  function stamp() {
    var v = (elInput.value || '').trim();
    if (!v) return;

    var item = { n: v };
    roll.push(item);
    if (roll.length > MAX_ROLL) roll = roll.slice(-MAX_ROLL);
    saveRoll();

    // 新盖的那一枚：先落进 DOM，再用一帧之后加 is-down 触发压印动画
    renderRoll();
    var last = elRoll.lastElementChild;
    if (last) {
      last.classList.add('is-new');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { last.classList.add('is-down'); });
      });
      // 滚到可见处，否则盖了印却看不见它落在哪
      if (last.scrollIntoView) {
        try { last.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) { /* 老浏览器忽略 */ }
      }
    }

    // 声与震：一声闷响 + 一下短震。都是锦上添花，缺了不影响
    if (H.audio && H.audio.ctx) {
      /* 用编钟的低音当"落印"——它不是印章真正的声音，
         但一声低沉的金石之音比任何拟音都更贴这一卷的气质。 */
      H.audio.bell(98, H.audio.now + 0.01, 0.6);
    }
    H.buzz(22);

    elInput.value = '';
    updatePreview();
    elInput.focus();
  }

  /* ---------- 事件 ---------- */
  function bindUI(root) {
    elInput.addEventListener('input', updatePreview);
    elInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); stamp(); }
    });
    elStampBtn.addEventListener('click', stamp);
    elStampBtn.disabled = true;
  }

  /* #sign=张仲景 —— 直接盖一枚印，好把刻出来的样子拍下来核对。
     为什么需要：这一卷的交互动线（打字 → 预览 → 按下 → 落下）在无头里跑不起来，
     但**印刻得对不对**恰恰是这一卷唯一要紧的事 ——
     边框抖得像不像手刻、字挖得干不干净、读序对不对，
     全都要看着实际像素才能判断。这个钩子把"必须手点一遍才能看到的东西"
     变成一条 URL。参数按逗号可给多个名字，一次把几种字数都盖出来比对
     （一字 / 二字 / 三字 / 四字的排版规则各不相同）。 */
  if (H.dbg.sign) {
    H.wait(200).then(function () {
      var stage = H.stageOf('name');
      if (!stage) return;
      build(stage);
      String(H.dbg.sign).split(',').forEach(function (v) {
        if (v) H.nameUI.stamp(v);
      });
    });
  }

  /* ---------- 章节 ---------- */
  H.chapter('name', {
    enter: function () {
      var stage = H.stageOf('name');
      if (!stage) return;
      build(stage);
      if (!armed) { bindUI(stage); armed = true; }
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { stage.classList.add('is-armed'); });
      });
      H.emit('name:enter');
    },
    leave: function () {
      var stage = H.stageOf('name');
      if (stage) stage.classList.remove('is-armed');
      H.emit('name:leave');
    }
  });

  H.nameUI = {
    built: function () { return built; },
    /* 暴露给调试与将来的扩展：直接盖一个名字 */
    stamp: function (v) {
      if (!elInput) return;
      elInput.value = v;
      updatePreview();
      stamp();
    },
    count: function () { return roll.length; },
    clear: function () { roll = []; saveRoll(); if (built) renderRoll(); }
  };
})();

</script>

<script data-from="assets/js/70-boot.js">
/* ============================================================================
 *  70-boot.js —— 启动编排：建导航、定初始态、处理调试深链与键盘
 *  必须是最后一个加载的脚本。
 * ========================================================================== */
(function () {
  'use strict';

  var H = window.HENAN;
  if (!H) return;

  var nav;

  /* ---------- 印章导航 ---------- */
  function buildNav() {
    nav = document.getElementById('hudNav');
    if (!nav) return;
    var frag = document.createDocumentFragment();
    H.order.forEach(function (id) {
      if (id === 'gate') return;                 // 序章不上导航
      var m = H.meta[id];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'hud-seal';
      b.dataset.chapter = id;
      b.setAttribute('aria-label', m.num + '·' + m.mark);
      b.title = m.num + ' · ' + m.mark;
      b.innerHTML = '<span class="hud-seal__mark">' + m.mark + '</span>' +
                    '<span class="hud-seal__num">' + m.num + '</span>';
      b.addEventListener('click', function () {
        if (H.audio) H.audio.blip(id === 'sound' ? 1320 : 1180, 0.8);
        H.go(id);
      });
      frag.appendChild(b);
    });
    nav.appendChild(frag);
    nav.hidden = false;
  }

  /* ---------- 章节进入后的联动 ---------- */
  function onChapterEnter(e) {
    // 序章是"封面"，此时露出章节导航会破坏开门的幻觉，进卷之后再出现
    nav.classList.toggle('is-shown', e.id !== 'gate');

    var m = H.meta[e.id];
    document.title = e.id === 'gate'
      ? '锦绣河南 · 形遗味声'
      : m.mark + ' · 锦绣河南';

    // 揭到新的一章时轻轻响一声，给"翻篇"一个听觉落点
    if (H.audio && e.from && !H.reduceMotion) {
      if (e.id === 'sound') H.audio.gong(110, 0.85);
      else H.audio.blip(e.id === 'scroll' ? 988 : 1174, 0.55);
    }
  }

  /* ---------- 调试深链 ---------- */
  /* tools/shot.sh 靠它把页面直接送进某个状态，好拍成截图核对。
     例：#debug=map&city=410100&stay=1 */
  function deepLink() {
    var to = H.dbg.debug;
    if (!to || H.order.indexOf(to) < 0) return;
    if (to === 'gate') return;                   // 序章本来就是初始态

    H.go(to, { instant: true, force: true });
    H.wait(80).then(function () {
      if (H.dbg.city) H.emit('map:open-city', { adcode: +H.dbg.city });
      if (H.dbg.dish) H.emit('scroll:open-dish', { adcode: +H.dbg.dish });
      if (H.dbg.inst) H.emit('sound:play', { id: H.dbg.inst });
      /* 后两卷的深链参数各自起名，与它们的正文用词一致：
         非遗是 craft（哪一项）、题名卷不需要参数。
         （人物卷的 who 随「人」卷一并删除，2026-09-29。） */
      if (H.dbg.craft) H.emit('crafts:open-item', { adcode: +H.dbg.craft });
      if (H.dbg.credits) H.emit('credits:open');
    });
  }

  /* ---------- 键盘 ---------- */
  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    /* ⚠️ 这一行修的是"按一次方向键翻两处"。
       本函数挂在 document 上、冒泡阶段；而三处章节内的方向键处理
       （50-scroll.js 翻版、60-sound.js 翻展品、40-map.js 推滑块）都在更内层，
       它们调了 preventDefault() 却**没有** stopPropagation()，本函数也不看 defaultPrevented。
       结果：焦点在味章某一版上按 → ，既翻到下一版、又跳去了下一章；
       在声章年代轴上按 → ，既换了展品、又离开了这一章。
       与其去三处各补一个 stopPropagation（漏一处就复发），
       不如在这里统一认 defaultPrevented —— 内层已经声明"这个键我处理了"，外层就该让开。 */
    if (e.defaultPrevented) return;

    if (e.key === 'Escape') { H.emit('ui:escape'); return; }

    // 数字键直跳：0 回序章，1~5 对应形/遗/味/声/名（跟着 ORDER 走）
    var map = {
      '0': 'gate', '1': 'map', '2': 'crafts', '3': 'scroll',
      '4': 'sound', '5': 'name'
    };
    if (map[e.key]) { H.go(map[e.key]); return; }

    // 章节间用左右方向键翻
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      var i = H.order.indexOf(H.current());
      if (i < 0) return;
      var next = i + (e.key === 'ArrowRight' ? 1 : -1);
      if (next >= 0 && next < H.order.length) H.go(H.order[next]);
    }
  }

  /* ---------- 视口变化 ---------- */
  /* 卡片定位、气泡尺寸都依赖 getBoundingClientRect 的缓存，
     视口一变缓存就失效。统一广播一次，各章自己去清。 */
  var onResize = H.rafThrottle(function () {
    H.emit('ui:resize', {
      w: window.innerWidth,
      h: window.innerHeight
    });
  });

  /* ---------- 启动 ---------- */
  function boot() {
    buildNav();

    // 初始态：序章。这里直接上 class，不走状态机 ——
    // 因为没有"上一章"可离开，走转场反而会先黑一下。
    var g = document.getElementById('stage-gate');
    if (g) g.classList.add('is-on');
    H.seed('gate');          // 必须同时登记 current，否则离开序章时它不会被摘掉

    H.on('chapter:enter', onChapterEnter);
    // 首章是手动点亮 stage 的，不会触发 chapter:enter，这里补一次导航同步
    nav.classList.toggle('is-shown', false);

    document.addEventListener('keydown', onKey);
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);

    // 把可能已在缓存里的图片补上 is-loaded（避免进场时闪一下）
    H.$$('.pic__img').forEach(function (img) {
      if (img.complete && img.naturalWidth) img.classList.add('is-loaded');
    });

    H.emit('boot:done');
    document.documentElement.classList.add('is-ready');

    deepLink();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();

</script>
<script data-from="assets/js/80-credits.js">
/* ============================================================================
 *  80-credits.js —— 「图片来源」页
 *
 *  参赛作品被查版权是真实风险，所以这一页不是装饰，是留痕：
 *  每一张图逐张列出「位置 / 图片标题 / 检索词 / 图片直链」，
 *  顶上再说明一句这些图到底是怎么来的。张数由 photos.js 现数，不写死在注释里。
 *
 *  ⚠️ 必须如实说：这些图**绝大多数来自 360 图片**，没有一张是 Wikimedia Commons 的；
 *     其中信阳 · 城阳城址那张（2026-09-29 补）由使用者直接提供，来源与授权未标注。
 *     fetch-images.js 本来把 Commons 当主力（授权干净），但这个网络环境下
 *     upload.wikimedia.org 取不到字节 —— Commons 的 API 能返回 200，
 *     图片 CDN 却超时，54 个目标里 0 张走通。所以是"先补齐、如实标注"，
 *     而不是"假装它是 CC 授权"。这一点绝不粉饰：
 *     360 只提供图片直链，不提供作者与协议，公开发布前需要替换或取得授权。
 *
 *     （后来又试过绕道：images.weserv.nl 是通的，它能代理维基的图服务器，
 *       但维基的**检索**接口本身不通，拿不到文件名；靠搜索结果拼出的几个文件名
 *       逐个去试，全部 404。所以这条路确认走不通，不是没试。）
 *
 *  这一页的 DOM 由本文件建，不写进 HTML —— 五十来行 × 4 列，
 *  写死在 HTML 里是两百来行无法维护的表格，而这里只是把 photos.js 摊开。
 * ========================================================================== */
(function () {
  'use strict';
  var H = window.HENAN;
  if (!H) return;

  var GROUP = {
    ancient: { key: 'ancient', title: '形 · 古代地标', note: '每个地级市的古代标志性建筑' },
    modern:  { key: 'modern',  title: '形 · 今地标',   note: '与古建对照的今日建筑' },
    food:    { key: 'food',    title: '味 · 中原美食', note: '《中原美食录》卷上的菜品图' }
  };

  var elRoot, elBtn, lastFocus = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* photos.js 的键是 "410100-ancient" 这种：adcode + 用途 */
  function splitKey(k) {
    var i = k.lastIndexOf('-');
    return { adcode: k.slice(0, i), use: k.slice(i + 1) };
  }

  function entries(use) {
    var all = H.photos || {};
    return Object.keys(all).filter(function (k) {
      return splitKey(k).use === use;
    }).sort(function (a, b) {
      return +splitKey(a).adcode - +splitKey(b).adcode;
    }).map(function (k) { return { key: k, p: all[k] }; });
  }

  function row(p) {
    var r = H.el('div', 'credits__row');
    r.appendChild(H.el('b', null, esc((p.city || '') + ' · ' + (p.subject || ''))));
    r.appendChild(H.el('span', null, esc(p.credit.title || '（无标题）')));
    r.appendChild(H.el('span', 'credits__sub', esc(p.credit.query || '—')));
    /* 直链不是"原始页面"。360 只给到图片 CDN 的地址，
       列名就老老实实写"图片直链"，不写成"来源页" —— 那是在替它编一个不存在的出处。 */
    if (p.credit.page) {
      var a = H.el('a', null, '图片直链 ↗');
      a.href = p.credit.page;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      r.appendChild(a);
    } else {
      /* 使用者直接提供的图没有可点的出处。写成一枚灰字，
         不做成 href="#" 的假链接 —— 点了没反应比没有更糟。 */
      r.appendChild(H.el('span', 'credits__sub', '由使用者提供，无外部出处'));
    }
    return r;
  }

  function build() {
    var root = H.el('div', 'credits');
    root.id = 'credits';
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-modal', 'true');
    root.setAttribute('aria-label', '图片来源');

    var head = H.el('header', 'credits__head');
    head.appendChild(H.el('h2', 'credits__title', '图片来源'));
    var close = H.el('button', 'btn credits__close', '合上');
    close.type = 'button';
    close.addEventListener('click', shut);
    head.appendChild(close);
    root.appendChild(head);

    var body = H.el('div', 'credits__body');

    var total = Object.keys(H.photos || {}).length;
    /* 按"有没有出处链接"分开数：360 给的是图片 CDN 直链，使用者直接提供的没有。
       数出来再写进文案，不写死数字 —— 以后再加图，这句话自己就对。 */
    var nUser = Object.keys(H.photos || {}).filter(function (k) {
      return !((H.photos[k].credit || {}).page);
    }).length;
    var n360 = total - nUser;
    body.appendChild(H.el('p', 'credits__note',
      '本页共 ' + total + ' 张照片，其中 ' + n360 + ' 张取自「360 图片」的搜索结果，' +
      '没有一张来自 Wikimedia Commons。' +
      (nUser ? '另有 ' + nUser + ' 张由使用者直接提供 —— 它们同样没有来源与授权标注。' : '') +
      '出图脚本原以 Commons 为主力（CC0 / 公有领域 / CC BY-SA，授权干净），' +
      '但本项目所处的网络环境取不到其图片服务器，' +
      '54 个目标里没有一张走通，因而改用 360 补齐。' +
      '360 只提供图片的直链，<b>不提供作者与授权协议</b>，' +
      '所以下表无法列出作者 —— 这不是漏填，是源头就没有。' +
      '若本作品公开发布或用于参赛展示，这些照片需要替换为授权明确的版本，或逐张取得授权。<br><br>' +
      '另有一张<b>单独的素材</b>：序章大门的门洞里那张“门外院子”' +
      '（assets/img/gate/vista.jpg），是从一张 1440×618 的参考图上量出 263×416 的门洞范围' +
      '裁下来的（裁法见 tools/crop-vista.py，边界是逐行扫出来的、不是目测的）。' +
      '它的来源与上面这些照片同一性质，同样没有作者与授权信息，' +
      '公开发布前需要一并替换。<br><br>' +
      '除上述照片与那一张裁片之外，页面上其余的一切都不是外部素材：' +
      '地图是本地 GeoJSON 烘焙出的 SVG 路径，' +
      '大门的两翼粉墙与墨云壁画、乐器图谱、非遗格子上的字、印章、' +
      '题名卷里观众自己盖的那方印，全部是手写 SVG / CSS / Canvas 现画的，' +
      '全部音声由 Web Audio 实时合成，' +
      '不加载任何字体、图标库或音频文件。'
    ));

    ['ancient', 'modern', 'food'].forEach(function (use) {
      var list = entries(use);
      var g = GROUP[use];
      if (!list.length) return;
      body.appendChild(H.el('h3', 'credits__group',
        g.title + '（' + list.length + ' 张）· ' + g.note));

      var hr = H.el('div', 'credits__row credits__row--head');
      hr.appendChild(H.el('b', null, '位置'));
      hr.appendChild(H.el('b', null, '图片标题 / 说明'));
      hr.appendChild(H.el('b', null, '检索词'));
      hr.appendChild(H.el('b', null, '链接'));
      body.appendChild(hr);

      list.forEach(function (e) { body.appendChild(row(e.p)); });
    });

    /* 没抓到的目标也列出来 —— 页面上的留白是看得出来的，
       与其让评委以为是漏做，不如在这里说清是图片没抓到。
       2026-09-29：唯一的一条（信阳 · 城阳城址）已由使用者补上，清单为空，
       整块因此不渲染；机制留着，将来再有补不上的目标照样会出现在这里。 */
    var miss = H.missing || [];
    if (miss.length) {
      body.appendChild(H.el('h3', 'credits__group', '未取到图片的目标（' + miss.length + ' 个）'));
      var box = H.el('div', 'credits__note',
        '以下目标按期检索过两轮仍未取到可用图片，页面上对应位置显示为留白占位（“图 未 至”），' +
        '没有用别的图顶替 —— 顶替会让图文对不上，比留白更糟。');
      var ul = H.el('div', 'credits__miss');
      miss.forEach(function (m) {
        ul.appendChild(H.el('span', 'credits__pill', esc(m.label || m.key)));
      });
      box.appendChild(ul);
      body.appendChild(box);
    }

    root.appendChild(body);
    document.body.appendChild(root);

    elBtn = H.el('button', 'hud-credit-btn', '图片来源');
    elBtn.type = 'button';
    elBtn.id = 'hudCredit';
    elBtn.addEventListener('click', open);
    document.body.appendChild(elBtn);

    elRoot = root;
  }

  function open() {
    if (!elRoot) return;
    lastFocus = document.activeElement;
    elRoot.classList.add('is-on');
    H.emit('credits:opened');
    var c = H.$('.credits__close', elRoot);
    if (c) c.focus();
  }

  function shut() {
    if (!elRoot || !elRoot.classList.contains('is-on')) return;
    elRoot.classList.remove('is-on');
    H.emit('credits:closed');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function toggle() {
    if (!elRoot) return;
    if (elRoot.classList.contains('is-on')) shut(); else open();
  }

  H.on('credits:open', function () {
    if (!elRoot) build();
    open();
  });
  H.on('credits:toggle', toggle);

  /* Esc 先收图片来源页，收完才轮到各章自己处理 ——
     同一层遮罩叠着的时候，Esc 应该只关最上面那一层。 */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !elRoot || !elRoot.classList.contains('is-on')) return;
    e.stopPropagation();
    shut();
  }, true);

  /* 按钮和印章导航一起出现：序章是封面，此时露按钮会破开门的幻觉 */
  H.on('chapter:enter', function (e) {
    if (!elBtn) return;
    elBtn.classList.toggle('is-shown', e.id !== 'gate');
  });

  H.credits = { open: open, close: shut, toggle: toggle, built: function () { return !!elRoot; } };
})();

</script>
